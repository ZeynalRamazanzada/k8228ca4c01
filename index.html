      for(const [k,t,p] of g){const arr=cards.filter(x=>{const s=stageOf(set,x);return k===1?(s===1||s===2):s===k});if(arr.length)list+=`<div class="tgroup-h"><span class="dot ${k===3?'m':k===1?'l':''}"></span>${t} (${arr.length})<p>${p}</p></div>`+arr.map(termRow).join('')}
    }else list=cards.map(termRow).join('');
    if(!cards.length)list=`<p class="foot" style="text-align:center;margin:20px">${filter==='star'?'Yıldızlı terim yok. Bir terimin yanındaki yıldıza dokunarak ekle.':'Bu sette kart yok.'}</p>`;
    $('.scroll',el).innerHTML=`
      <h1 class="ltitle">${esc(set.title||'Başlıksız set')}</h1>
      <div class="meta-line"><span>${c.n} terim</span><span>·</span><span>${esc(langName(set.termLang))} → ${esc(langName(set.defLang))}</span>${set.example?'<span class="badge">Örnek</span>':''}</div>
      ${set.desc?`<p class="desc">${esc(set.desc)}</p>`:''}
      ${pv.length?`<div class="preview" id="pv">${pv.map(x=>`<div class="pv" data-pv="${x.id}"><div class="pv-in"><div class="pv-f"><span>${esc(x.t)}</span></div><div class="pv-f pv-b"><span>${esc(x.d)}</span></div></div></div>`).join('')}</div><div class="pv-count" id="pv-n">1 / ${pv.length}</div>`:''}
      <div class="modes">
        <button class="mode" data-m="fc"><span class="mic">${ic('cards')}</span><span>Kartlar<small>Çevir ve sırala</small></span></button>
        <button class="mode" data-m="learn"><span class="mic">${ic('learn')}</span><span>Öğren<small>Adım adım ezberle</small></span></button>
        <button class="mode" data-m="test"><span class="mic">${ic('test')}</span><span>Test<small>Kendini sına</small></span></button>
        <button class="mode" data-m="match"><span class="mic">${ic('match')}</span><span>Eşleştir<small>Zamana karşı</small></span></button>
      </div>
      <div class="sh"><span>İlerlemen</span><span class="link" style="color:var(--text2)">%${c.n?Math.round(c.ms/c.n*100):0}</span></div>
      <div class="card">${pbarHTML(c)}<div class="legend"><span class="m"><b>${c.ms}</b> öğrenildi</span><span class="l"><b>${c.lr}</b> öğreniliyor</span><span><b>${c.ns}</b> öğrenilmedi</span></div></div>
      <div class="sh"><span>Terimler (${c.n})</span><button class="link" data-sort>${sort==='prog'?'İlerlemeye göre':'Orijinal sıra'}</button></div>
      <div class="terms-bar">${segHTML('tfilter',[['all','Tümü'],['star',`Yıldızlı (${nStar})`]],filter)}</div>
      <div id="tlist">${list}</div>
      <button class="btn sec" data-add style="margin-top:8px">${ic('plus')} Kart ekle</button>`;
    // önizleme kartları
    const pvEl=$('#pv',el);
    if(pvEl){
      $$('.pv',pvEl).forEach(p=>p.addEventListener('click',()=>{p.classList.toggle('flip')}));
      pvEl.addEventListener('scroll',()=>{const i=Math.round(pvEl.scrollLeft/(pvEl.firstElementChild.offsetWidth+12));$('#pv-n',el).textContent=(i+1)+' / '+pv.length},{passive:true});
    }
    $$('[data-m]',el).forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.m;if(!set.cards.length){toast('Önce birkaç kart ekle');return}
      if(m==='fc')openFlashcards(set);else if(m==='learn')openLearn(set);else if(m==='test')openTest(set);else openMatch(set)}));
    $$('[data-say]',el).forEach(b=>b.addEventListener('click',()=>{const x=set.cards.find(k=>k.id===b.dataset.say);if(x)TTS.speak(x.t,set.termLang)}));
    $$('[data-star]',el).forEach(b=>b.addEventListener('click',()=>{const x=set.cards.find(k=>k.id===b.dataset.star);if(!x)return;x.star=!x.star;haptic();touchSet(set);render()}));
    bindSeg(el,'tfilter',v=>{filter=v;render()});
    $('[data-sort]',el).addEventListener('click',e=>menu(e.currentTarget,[{label:'Orijinal sıra',act:()=>{sort='orig';render()}},{label:'İlerlemeye göre',act:()=>{sort='prog';render()}}]));
    $('[data-add]',el).addEventListener('click',()=>openEditor(id,true));
  }
  $('[data-more]',el).addEventListener('click',e=>menu(e.currentTarget,[
    {label:'Düzenle',icon:'edit',act:()=>openEditor(id)},
    {label:'Kelimeleri metin olarak kopyala',icon:'copy',act:()=>copyText(set.cards.map(c=>c.t+'\t'+c.d).join('\n'))},
    {label:'İlerlemeyi sıfırla',icon:'refresh',act:async()=>{if(await ask({title:'İlerleme sıfırlansın mı?',msg:'Öğren, Kartlar ve aralıklı tekrar ilerlemen bu set için sıfırlanır.',ok:'Sıfırla',danger:true})){set.prog={};set.round=0;set.fcs=null;set.srs={};set.srsNew={};touchSet(set);render();toast('İlerleme sıfırlandı')}}},
    '-',
    {label:'Seti sil',icon:'trash',danger:true,act:async()=>{if(await ask({title:'Bu set silinsin mi?',msg:`“${set.title}” ve içindeki ${set.cards.length} kart silinecek.`,ok:'Sil',danger:true})){removeSet(id);pop();toast('Set silindi');refreshVisible()}}}
  ]));
  render();push(scr);
}
function copyText(txt){
  const done=()=>toast('Kopyalandı');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback())}else fallback();
  function fallback(){const s=sheet({title:'Kelimeleri kopyala',body:`<p class="foot" style="margin:0 4px 10px">Metni seçip kopyalayabilirsin (her satırda: kelime ⇥ anlam).</p><textarea class="imp-ta" readonly>${esc(txt)}</textarea>`});const ta=$('textarea',s.body);ta.focus();ta.select()}
}
</script>
<script>
/* =========================================================
   Set oluştur / düzenle
   ========================================================= */
function openEditor(id,focusNew=false){
  const src=id?S.sets[id]:null;
  const d={title:src?src.title:'',desc:src?src.desc:'',termLang:src?src.termLang:'en-US',defLang:src?src.defLang:'tr-TR',
    cards:src?src.cards.map(c=>({...c})):[0,1,2].map(()=>({id:uid(),t:'',d:'',star:false}))};
  if(focusNew)d.cards.push({id:uid(),t:'',d:'',star:false});
  let dirty=false;
  const langOpts=v=>LANGS.map(([c,n])=>`<option value="${c}" ${c===v?'selected':''}>${n}</option>`).join('');
  const el=makeScreen({title:src?'Seti düzenle':'Set oluştur',left:`<button class="gbtn glass" data-cancel aria-label="İptal">${ic('x')}</button>`,right:`<button class="gpill glass tint" data-save>${ic('check')}<span>Bitti</span></button>`});
  const scr={el,close:cancel};
  $('.scroll',el).innerHTML=`
    <h1 class="ltitle">${src?'Seti düzenle':'Yeni set'}</h1>
    <div class="field"><input id="ed-title" class="inp big" placeholder="Başlık, örn. “Unit 3 – Travel”" value="${esc(d.title)}" autocomplete="off"><label for="ed-title">BAŞLIK</label></div>
    <div class="field"><textarea id="ed-desc" class="inp" rows="1" placeholder="Açıklama ekle (isteğe bağlı)">${esc(d.desc)}</textarea><label for="ed-desc">AÇIKLAMA</label></div>
    <div class="ed-langs"><label>TERİM DİLİ<select id="ed-tl">${langOpts(d.termLang)}</select></label><label>TANIM DİLİ<select id="ed-dl">${langOpts(d.defLang)}</select></label></div>
    <div class="ed-tools"><button class="chipbtn" data-import>${ic('import')} Listeden içe aktar</button><button class="chipbtn" data-swap>${ic('swap')} Terim ↔ Tanım</button></div>
    <div id="ed-cards"></div>
    <button class="btn sec addcard" data-add>${ic('plus')} Kart ekle</button>
    <p class="foot">İpucu: Tanım alanında klavyedeki “Enter” tuşu seni sonraki karta götürür; son karttaysan yeni kart açar.</p>`;
  const wrap=$('#ed-cards',el);
  const grow=t=>{if(!t.isConnected)return;t.style.height='auto';if(t.scrollHeight)t.style.height=t.scrollHeight+'px'};
  function cardHTML(c,i){return`<div class="ecard" data-id="${c.id}"><div class="ec-head"><span class="ec-num">${i+1}</span><button class="icbtn" data-del aria-label="Kartı sil">${ic('trash')}</button></div>
    <div class="field"><textarea class="inp" rows="1" data-k="t" placeholder="Terim (ör. İngilizce kelime)" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">${esc(c.t)}</textarea><label>TERİM</label></div>
    <div class="field"><textarea class="inp" rows="1" data-k="d" placeholder="Tanım (ör. Türkçe anlamı)" autocapitalize="none" enterkeyhint="next">${esc(c.d)}</textarea><label>TANIM</label></div></div>`}
  function renderCards(){wrap.innerHTML=d.cards.map(cardHTML).join('');$$('textarea',wrap).forEach(grow)}
  function renumber(){$$('.ec-num',wrap).forEach((n,i)=>n.textContent=i+1)}
  function addCard(focus=true){const c={id:uid(),t:'',d:'',star:false};d.cards.push(c);const n=h(cardHTML(c,d.cards.length-1));wrap.appendChild(n);if(focus){const t=$('[data-k=t]',n);t.focus();setTimeout(()=>n.scrollIntoView({behavior:'smooth',block:'center'}),50)}return n}
  renderCards();
  wrap.addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;const cid=t.closest('.ecard').dataset.id;const c=d.cards.find(x=>x.id===cid);if(c){c[t.dataset.k]=t.value;dirty=true}grow(t);t.closest('.ecard').classList.remove('err')});
  wrap.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||e.shiftKey||!e.target.dataset.k)return;e.preventDefault();
    const card=e.target.closest('.ecard');
    if(e.target.dataset.k==='t'){$('[data-k=d]',card).focus();return}
    const next=card.nextElementSibling;if(next)$('[data-k=t]',next).focus();else addCard(true);
  });
  wrap.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;const card=b.closest('.ecard');if(d.cards.length<=1){toast('En az bir kart kalmalı');return}d.cards=d.cards.filter(x=>x.id!==card.dataset.id);card.remove();renumber();dirty=true});
  $('#ed-title',el).addEventListener('input',e=>{d.title=e.target.value;dirty=true});
  const desc=$('#ed-desc',el);grow(desc);desc.addEventListener('input',()=>{d.desc=desc.value;grow(desc);dirty=true});
  $('#ed-tl',el).addEventListener('change',e=>{d.termLang=e.target.value;dirty=true});
  $('#ed-dl',el).addEventListener('change',e=>{d.defLang=e.target.value;dirty=true});
  $('[data-add]',el).addEventListener('click',()=>addCard(true));
  $('[data-swap]',el).addEventListener('click',()=>{d.cards.forEach(c=>{[c.t,c.d]=[c.d,c.t]});[d.termLang,d.defLang]=[d.defLang,d.termLang];$('#ed-tl',el).value=d.termLang;$('#ed-dl',el).value=d.defLang;renderCards();dirty=true;toast('Terimler ve tanımlar yer değiştirdi')});
  $('[data-import]',el).addEventListener('click',()=>openImport(rows=>{
    d.cards=d.cards.filter(c=>c.t.trim()||c.d.trim());
    rows.forEach(([t,dd])=>d.cards.push({id:uid(),t,d:dd,star:false}));
    if(!d.cards.length)d.cards.push({id:uid(),t:'',d:'',star:false});
    renderCards();dirty=true;toast(rows.length+' kart eklendi');
  }));
  $('[data-cancel]',el).addEventListener('click',cancel);
  $('[data-save]',el).addEventListener('click',save);
  async function cancel(){if(dirty&&!await ask({title:'Değişiklikler kaydedilmedi',msg:'Çıkarsan yaptığın değişiklikler kaybolur.',ok:'Çık',cancel:'Düzenlemeye dön',danger:true}))return;pop()}
  function save(){
    const title=d.title.trim();
    if(!title){toast('Sete bir başlık ver');$('#ed-title',el).focus();return}
    const cards=d.cards.map(c=>({...c,t:c.t.trim(),d:c.d.trim()})).filter(c=>c.t||c.d);
    const bad=cards.findIndex(c=>!c.t||!c.d);
    if(bad>=0){const id2=cards[bad].id;const n=$(`.ecard[data-id="${id2}"]`,wrap);if(n){n.classList.add('err');n.scrollIntoView({behavior:'smooth',block:'center'})}toast('Her kartta hem terim hem tanım olmalı');return}
    if(cards.length<2){toast('Çalışmak için en az 2 kart gerekli');return}
    if(src){
      const keep=new Set(cards.map(c=>c.id));
      for(const k of Object.keys(src.prog))if(!keep.has(k))delete src.prog[k];
      for(const k of Object.keys(src.srs||{}))if(!keep.has(k))delete src.srs[k];
      Object.assign(src,{title,desc:d.desc.trim(),termLang:d.termLang,defLang:d.defLang,cards});
      if(src.example&&title!=='Örnek set · Günlük İngilizce')src.example=false;
      src.fcs=null;touchSet(src);dirty=false;pop();toast('Kaydedildi');
    }else{
      const set=blankSet(title);Object.assign(set,{desc:d.desc.trim(),termLang:d.termLang,defLang:d.defLang,cards});
      addSet(set);dirty=false;pop();setTimeout(()=>openSet(set.id),80);
    }
  }
  push(scr,'cover');
  $$('textarea',el).forEach(grow);
  if(!src)setTimeout(()=>$('#ed-title',el).focus(),450);
  else if(focusNew)setTimeout(()=>{const last=wrap.lastElementChild;last&&last.scrollIntoView({block:'center'})},450);
}

/* Listeden içe aktar — Quizlet'teki gibi ayırıcı seçimi */
function openImport(onDone){
  let between='auto',rowsSep='nl',cb='',cr='';
  const body=h(`<div>
    <p class="foot" style="margin:0 4px 12px">Notlarından, Excel’den veya Quizlet’ten kopyaladığın listeyi yapıştır. Her satır bir kart olur.</p>
    <textarea class="imp-ta" id="imp-t" placeholder="achieve - başarmak&#10;borrow - ödünç almak&#10;careful - dikkatli"></textarea>
    <div class="opt-label">Terim ile tanım arası</div>
    ${segHTML('imp-b',[['auto','Otomatik'],['tab','Sekme'],['dash','Tire'],['comma','Virgül'],['custom','Özel']],between)}
    <input class="custom-sep" id="imp-cb" placeholder="Özel ayırıcı, örn. =" hidden>
    <div class="opt-label">Kartlar arası</div>
    ${segHTML('imp-r',[['nl','Yeni satır'],['semi','Noktalı virgül'],['custom','Özel']],rowsSep)}
    <input class="custom-sep" id="imp-cr" placeholder="Özel ayırıcı, örn. |" hidden>
    <div class="opt-label" id="imp-n">Önizleme</div>
    <div class="group imp-prev" id="imp-p"><div class="row muted">Yapıştırdığın kartlar burada görünecek.</div></div>
    <button class="btn" id="imp-go" style="margin-top:16px" disabled>İçe aktar</button>
  </div>`);
  const s=sheet({title:'Listeden içe aktar',body,full:true});
  const ta=$('#imp-t',body);
  function splitRow(line){
    const seps=between==='tab'?['\t']:between==='dash'?[' - ',' – ',' — ','-']:between==='comma'?[',']:between==='custom'?[cb||'\t']:['\t',' - ',' – ',' — ',' = ',' : ','=',':',' -','- ',',','-'];
    for(const sp of seps){const i=line.indexOf(sp);if(i>0)return[line.slice(0,i).trim(),line.slice(i+sp.length).trim()]}
    return null;
  }
  function parse(){
    const txt=ta.value;const rs=rowsSep==='semi'?txt.split(';'):rowsSep==='custom'?txt.split(cr||'\n'):txt.split(/\r?\n/);
    const out=[];for(const r of rs){const l=r.trim();if(!l)continue;const p=splitRow(l);if(p&&p[0]&&p[1])out.push(p)}
    return out;
  }
  function upd(){
    const rows=parse();
    $('#imp-n',body).textContent=rows.length?`Önizleme · ${rows.length} kart`:'Önizleme';
    $('#imp-p',body).innerHTML=rows.length?rows.slice(0,8).map(([t,d])=>`<div class="row"><b class="grow">${esc(t)}</b><span class="muted">${esc(d)}</span></div>`).join('')+(rows.length>8?`<div class="row muted">+${rows.length-8} kart daha</div>`:''):'<div class="row muted">Yapıştırdığın kartlar burada görünecek.</div>';
    const b=$('#imp-go',body);b.disabled=!rows.length;b.textContent=rows.length?`${rows.length} kartı içe aktar`:'İçe aktar';
  }
  ta.addEventListener('input',upd);
  bindSeg(body,'imp-b',v=>{between=v;$('#imp-cb',body).hidden=v!=='custom';upd()});
  bindSeg(body,'imp-r',v=>{rowsSep=v;$('#imp-cr',body).hidden=v!=='custom';upd()});
  $('#imp-cb',body).addEventListener('input',e=>{cb=e.target.value;upd()});
  $('#imp-cr',body).addEventListener('input',e=>{cr=e.target.value;upd()});
  $('#imp-go',body).addEventListener('click',()=>{const rows=parse();if(rows.length){s.close();onDone(rows)}});
  setTimeout(()=>ta.focus(),400);
}

/* =========================================================
   KARTLAR — göz at / temel sıralama / aralıklı tekrar
   ========================================================= */
let ACTIVE_SET=null;
const FDEF={method:'sort',front:'term',shuffle:false,starred:false,audio:false,newPerDay:20};
function openFlashcards(set){
  const O=set.fcp={...FDEF,...(set.fcp||{})};
  ACTIVE_SET=set.id;
  const el=h(`<section class="screen study"><header class="nav">${closeBtn}<div class="ctr" id="fc-ctr"></div><div class="spacer"></div><button class="gbtn glass" data-opt aria-label="Seçenekler">${ic('sliders')}</button></header><div class="sbody" id="fc-body"></div></section>`);
  const scr={el,study:true,onClose(){stopAuto();ACTIVE_SET=null}};
  const body=$('#fc-body',el);
  let deck=[],idx=0,flipped=false,auto=0,hist=[],queue=[],cur=null;
  const byId=id=>set.cards.find(c=>c.id===id);
  const pool=()=>{let c=set.cards;if(O.starred){const s=c.filter(x=>x.star);if(s.length)c=s}return c};
  const faceText=(c,side)=>side==='front'?(O.front==='term'?c.t:c.d):(O.front==='term'?c.d:c.t);
  const faceLang=side=>(side==='front')===(O.front==='term')?set.termLang:set.defLang;

  function start(reset){
    stopAuto();hist=[];
    if(O.method==='sort'){
      const ids=pool().map(c=>c.id);
      if(reset||!set.fcs||!set.fcs.deck||set.fcs.deck.some(id=>!byId(id))||set.fcs.starred!==O.starred){
        set.fcs={deck:O.shuffle?shuffle(ids):ids,idx:0,know:[],learn:[],starred:O.starred,round:1};touchSet(set);
      }
      deck=set.fcs.deck;idx=set.fcs.idx;
      if(idx>=deck.length)return sortEnd();
    }else if(O.method==='browse'){
      deck=pool().map(c=>c.id);if(O.shuffle)deck=shuffle(deck);idx=0;
    }else{buildSrsQueue()}
    renderCard();
  }
  /* ---- aralıklı tekrar ---- */
  function buildSrsQueue(){
    const t=now(),today=dayKey();set.srsNew=set.srsNew||{};const usedNew=set.srsNew[today]||0;
    const due=[],fresh=[];
    for(const c of pool()){const r=set.srs[c.id];if(!r)fresh.push(c.id);else if(r.due<=t)due.push(c.id)}
    due.sort((a,b)=>set.srs[a].due-set.srs[b].due);
    const nNew=Math.max(0,O.newPerDay-usedNew);
    queue=[...due,...(O.shuffle?shuffle(fresh):fresh).slice(0,nNew)];
  }
  function srsLabel(days){if(days<1){const m=Math.max(1,Math.round(days*1440));return m<60?m+' dk':Math.round(m/60)+' sa'}return days<30?Math.round(days)+' g':Math.round(days/30)+' ay'}
  function srsNext(r,g){ // g: 0 tekrar,1 zor,2 iyi,3 kolay
    r={iv:0,ef:2.5,reps:0,lapses:0,...(r||{})};
    if(g===0){r.lapses++;r.reps=0;r.ef=Math.max(1.3,r.ef-.2);r.iv=1/1440}
    else if(g===1){r.ef=Math.max(1.3,r.ef-.15);r.iv=r.reps===0?10/1440:Math.max(1,r.iv*1.2);if(r.reps>0)r.reps++}
    else if(g===2){r.iv=r.reps===0?1:r.reps===1?3:Math.round(r.iv*r.ef);r.reps++}
    else{r.iv=r.reps===0?4:Math.round(Math.max(r.iv,1)*r.ef*1.3);r.ef+=.15;r.reps++}
    r.due=now()+r.iv*DAY;return r;
  }
  /* ---- kart çizimi ---- */
  function currentCard(){if(O.method==='srs')return byId(queue[0]);return byId(deck[idx])}
  function renderCard(){
    cur=currentCard();flipped=false;
    if(!cur){if(O.method==='srs')return srsEnd();if(O.method==='browse')return browseEnd();return sortEnd()}
    const total=O.method==='srs'?queue.length:deck.length;
    $('#fc-ctr',el).innerHTML=O.method==='srs'?`${queue.length}<small>bugün kalan kart</small>`:`${idx+1} / ${total}`;
    const f=faceText(cur,'front'),b=faceText(cur,'back');
    const top=O.method==='sort'?`<div class="fc-top"><span class="cnt l" id="c-l">${set.fcs.learn.length}</span><div class="thin"><i style="width:${idx/total*100}%"></i></div><span class="cnt k" id="c-k">${set.fcs.know.length}</span></div>`
      :O.method==='browse'?`<div class="fc-top"><div class="thin"><i style="width:${(idx+1)/total*100}%"></i></div></div>`
      :`<div class="fc-top"><div class="thin"><i style="width:0%"></i></div></div>`;
    const acts=`<div class="fc-acts"><button class="icbtn" data-say aria-label="Seslendir">${ic('speaker')}</button><button class="icbtn ${cur.star?'on':''}" data-star aria-label="Yıldızla">${ic('star')}</button></div>`;
    const ctrl=O.method==='sort'
      ?`<div class="fc-ctrl"><button class="cbtn sm glass" data-undo aria-label="Geri al" ${hist.length?'':'disabled style="opacity:.35"'}>${ic('undo')}</button><button class="cbtn l glass" data-l aria-label="Hâlâ öğreniyorum">${ic('x')}</button><button class="cbtn k glass" data-k aria-label="Biliyorum">${ic('check')}</button><span class="cbtn sm" aria-hidden="true"></span></div>`
      :O.method==='browse'
      ?`<div class="fc-ctrl"><button class="cbtn sm glass ${O.shuffle?'on':''}" data-shuf aria-label="Karıştır">${ic('shuffle')}</button><button class="cbtn glass" data-prev aria-label="Önceki">${ic('left')}</button><button class="cbtn glass" data-next aria-label="Sonraki">${ic('right')}</button><button class="cbtn sm glass ${auto?'on':''}" data-auto aria-label="Otomatik oynat">${ic(auto?'pause':'play')}</button></div>`
      :`<div class="fc-reveal" id="srs-area"><button class="btn" data-reveal>Cevabı göster</button></div>`;
    body.innerHTML=`${top}
      <div class="fc-stage"><div class="fc-drag appear" id="drag"><div class="fc" id="fc">
        <div class="fc-face fc-front"><span class="fc-side">${O.front==='term'?'Terim':'Tanım'}</span>${acts}<div class="fc-text ${sizeCls(f)}">${esc(f)}</div>${idx===0&&O.method!=='srs'?'<div class="fc-hint">Çevirmek için dokun</div>':''}</div>
        <div class="fc-face fc-back"><span class="fc-side">${O.front==='term'?'Tanım':'Terim'}</span>${acts}<div class="fc-text ${sizeCls(b)}">${esc(b)}</div></div>
      </div>${O.method==='sort'?'<div class="fc-tag l">ÖĞRENİYORUM</div><div class="fc-tag k">BİLİYORUM</div>':''}</div></div>
      ${ctrl}`;
    bindCard();
    if(O.audio)TTS.speak(f,faceLang('front'));
  }
  function flip(){
    const fc=$('#fc',el);if(!fc)return;flipped=!flipped;fc.classList.toggle('flip',flipped);haptic(5);
    if(O.audio)TTS.speak(faceText(cur,flipped?'back':'front'),faceLang(flipped?'back':'front'));
    if(O.method==='srs'&&flipped)showSrsButtons();
  }
  function showSrsButtons(){
    const a=$('#srs-area',el);if(!a||a.classList.contains('srs-btns'))return;
    const r=set.srs[cur.id];const lab=g=>srsLabel(srsNext(r,g).iv);
    a.className='srs-btns';
    a.innerHTML=`<button class="r" data-g="0">Tekrar<small>${lab(0)}</small></button><button class="h" data-g="1">Zor<small>${lab(1)}</small></button><button class="g" data-g="2">İyi<small>${lab(2)}</small></button><button class="e" data-g="3">Kolay<small>${lab(3)}</small></button>`;
    $$('[data-g]',a).forEach(b=>b.addEventListener('click',()=>rateSrs(+b.dataset.g)));
  }
  function rateSrs(g){
    const isNew=!set.srs[cur.id];
    if(isNew){const k=dayKey();set.srsNew[k]=(set.srsNew[k]||0)+1}
    const r=srsNext(set.srs[cur.id],g);set.srs[cur.id]=r;
    queue.shift();
    if(r.iv<1/48){queue.splice(Math.min(queue.length,g===0?3:6),0,cur.id)}
    markStudied(set);touchSet(set);
    flyOut(g===0?-1:1,renderCard);
  }
  function bindCard(){
    const drag=$('#drag',el),stage=$('.fc-stage',el);
    let sx=0,sy=0,dx=0,down=false,moved=false;
    stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;moved=false;sx=e.clientX;sy=e.clientY;dx=0;drag.style.transition='none';drag.classList.remove('appear');try{drag.setPointerCapture(e.pointerId)}catch(_){}});
    stage.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;const dy=e.clientY-sy;if(Math.abs(dx)>8||Math.abs(dy)>8)moved=true;if(O.method==='srs')return;drag.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;
      if(O.method==='sort'){const p=clamp(Math.abs(dx)/110,0,1);$('.fc-tag.k',el).style.opacity=dx>0?p:0;$('.fc-tag.l',el).style.opacity=dx<0?p:0;$$('.fc-face',el).forEach(f=>f.style.borderColor=dx>40?'var(--good)':dx<-40?'var(--warn)':'transparent')}});
    const up=()=>{if(!down)return;down=false;drag.style.transition='';
      if(!moved){flip();return}
      if(O.method!=='srs'&&Math.abs(dx)>95){
        if(O.method==='sort')sortAnswer(dx>0);
        else{dx<0?go(1):go(-1)}
      }else{drag.style.transform='';$$('.fc-tag',el).forEach(t=>t.style.opacity=0);$$('.fc-face',el).forEach(f=>f.style.borderColor='transparent')}};
    stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
    $$('[data-say]',el).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();TTS.speak(faceText(cur,flipped?'back':'front'),faceLang(flipped?'back':'front'))}));
    $$('[data-star]',el).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();cur.star=!cur.star;haptic();touchSet(set);$$('[data-star]',el).forEach(x=>x.classList.toggle('on',cur.star))}));
    const on=(s,f)=>{const b=$(s,el);b&&b.addEventListener('click',f)};
    on('[data-k]',()=>sortAnswer(true));on('[data-l]',()=>sortAnswer(false));
    on('[data-undo]',undo);on('[data-auto]',toggleAuto);
    on('[data-prev]',()=>go(-1));on('[data-next]',()=>go(1));
    on('[data-shuf]',()=>{O.shuffle=!O.shuffle;touchSet(set);const id=deck[idx];deck=O.shuffle?shuffle(pool().map(c=>c.id)):pool().map(c=>c.id);idx=Math.max(0,deck.indexOf(id));renderCard();toast(O.shuffle?'Karıştırma açık':'Karıştırma kapalı')});
    on('[data-reveal]',()=>{if(!flipped)flip()});
  }
  function flyOut(dir,then){const d=$('#drag',el);if(!d){then();return}d.style.transition='transform .28s ease-in,opacity .28s';d.style.transform=`translateX(${dir*innerWidth*1.1}px) rotate(${dir*18}deg)`;d.style.opacity='0';setTimeout(then,220)}
  function go(step){
    if(O.method!=='browse')return;
    if(step<0&&idx===0){const d=$('#drag',el);d.style.transform='';return}
    flyOut(step>0?-1:1,()=>{idx+=step;renderCard()});
  }
  function sortAnswer(know){
    const F=set.fcs;hist.push({idx,know});
    (know?F.know:F.learn).push(deck[idx]);F.idx=++idx;markStudied(set);touchSet(set);haptic(know?8:15);
    const c=$(know?'#c-k':'#c-l',el);if(c){c.textContent=(know?F.know:F.learn).length;c.classList.add('bump');setTimeout(()=>c.classList.remove('bump'),250)}
    flyOut(know?1:-1,()=>{idx>=deck.length?sortEnd():renderCard()});
  }
  function undo(){
    const last=hist.pop();if(!last)return;const F=set.fcs;
    const arr=last.know?F.know:F.learn;arr.splice(arr.lastIndexOf(deck[last.idx]),1);F.idx=idx=last.idx;touchSet(set);renderCard();
  }
  function toggleAuto(){if(auto){stopAuto();renderCardControlsOnly();return}
    auto=setInterval(()=>{if(!cur){stopAuto();return}if(!flipped)flip();else{if(idx>=deck.length-1){stopAuto();browseEnd();return}idx++;renderCard()}},3200);
    renderCardControlsOnly();}
  function stopAuto(){clearInterval(auto);auto=0}
  function renderCardControlsOnly(){const b=$('[data-auto]',el);if(b){b.classList.toggle('on',!!auto);b.innerHTML=ic(auto?'pause':'play')}}
  /* ---- bitiş ekranları ---- */
  function sortEnd(){
    stopAuto();const F=set.fcs;const k=F.know.length,l=F.learn.length,t=k+l||1;
    $('#fc-ctr',el).textContent='Tur '+(F.round||1);
    body.innerHTML=`<div class="done">
      <h2>${l?'Harika gidiyorsun! Zor terimlere odaklanmaya devam et.':'Tebrikler! Bu turdaki tüm kartları biliyorsun.'}</h2>
      <div class="ringrow"><div class="ring">${ringSVG(k/t)}<b>%${Math.round(k/t*100)}</b></div>
        <div class="stat-list"><div class="stat k"><span>Biliyorum</span><span>${k}</span></div><div class="stat l"><span>Öğreniyorum</span><span>${l}</span></div><div class="stat n"><span>Kalan</span><span>0</span></div></div></div>
      <div class="btns">
        ${l?`<button class="btn" data-again>${l} terimi tekrar et</button>`:''}
        <button class="btn ${l?'sec':''}" data-restart>Kartları baştan başlat</button>
        <button class="btn ghost" data-learn>${ic('learn')} Öğren moduna geç</button>
      </div></div>`;
    const a=$('[data-again]',body);a&&a.addEventListener('click',()=>{set.fcs={deck:O.shuffle?shuffle(F.learn):F.learn.slice(),idx:0,know:[],learn:[],starred:O.starred,round:(F.round||1)+1};touchSet(set);start(false)});
    $('[data-restart]',body).addEventListener('click',()=>start(true));
    $('[data-learn]',body).addEventListener('click',()=>{pop();setTimeout(()=>openLearn(set),60)});
  }
  function browseEnd(){
    stopAuto();$('#fc-ctr',el).textContent=deck.length+' / '+deck.length;
    body.innerHTML=`<div class="center-stage"><div class="art">${ic('check')}</div><h2>Tüm kartları gözden geçirdin!</h2><p>Kelimeleri gerçekten öğrenmek için Öğren modunu dene; seni önce şıklarla, sonra yazarak çalıştırır.</p>
      <div class="btns"><button class="btn" data-learn>${ic('learn')} Öğren’e geç</button><button class="btn sec" data-restart>Baştan başla</button></div></div>`;
    $('[data-restart]',body).addEventListener('click',()=>start(true));
    $('[data-learn]',body).addEventListener('click',()=>{pop();setTimeout(()=>openLearn(set),60)});
  }
  function srsEnd(){
    $('#fc-ctr',el).textContent='Aralıklı tekrar';
    const nextDue=Object.values(set.srs).map(r=>r.due).filter(d=>d>now()).sort((a,b)=>a-b)[0];
    body.innerHTML=`<div class="center-stage"><div class="art">${ic('clock')}</div><h2>Bugünlük bu kadar!</h2><p>Tekrarı gelen kart kalmadı.${nextDue?` Sıradaki kart ${srsLabel((nextDue-now())/DAY)} sonra hazır olacak.`:''} Günde ${O.newPerDay} yeni kart eklenir; bunu seçeneklerden değiştirebilirsin.</p>
      <div class="btns"><button class="btn" data-browse>Kartlara göz at</button><button class="btn sec" data-more>Bugün 10 yeni kart daha</button></div></div>`;
    $('[data-browse]',body).addEventListener('click',()=>{O.method='browse';touchSet(set);start(true)});
    $('[data-more]',body).addEventListener('click',()=>{const k=dayKey();set.srsNew[k]=Math.max(0,(set.srsNew[k]||0)-10);touchSet(set);start(false)});
  }
  /* ---- seçenekler ---- */
  function options(){
    stopAuto();
    const b=h(`<div>
      <div class="opt-label">Çalışma yöntemi</div>
      ${segHTML('o-m',[['browse','Göz at'],['sort','Sıralama'],['srs','Aralıklı tekrar']],O.method)}
      <p class="opt-desc" id="o-md"></p>
      <div class="opt-label">Ön yüz</div>
      ${segHTML('o-f',[['term','Terim'],['def','Tanım']],O.front)}
      <div class="opt-label">Ayarlar</div>
      <div class="group">${swRow('o-sh','Kartları karıştır',O.shuffle)}${swRow('o-st','Sadece yıldızlı terimler',O.starred,set.cards.filter(c=>c.star).length+' yıldızlı terim')}${swRow('o-au','Otomatik sesli okuma',O.audio)}</div>
      <div id="o-srs"><div class="opt-label">Günlük yeni kart</div><div class="group"><div class="row"><span class="grow">Aralıklı tekrarda her gün</span><div class="stepper"><button data-s="-5" aria-label="Azalt">−</button><input id="o-np" inputmode="numeric" value="${O.newPerDay}" aria-label="Günlük yeni kart"><button data-s="5" aria-label="Artır">+</button></div></div></div></div>
      <button class="btn sec" id="o-reset" style="margin-top:22px">${ic('refresh')} Kartları sıfırla</button>
    </div>`);
    const desc={browse:'Kartları sırayla çevir. Sağa-sola kaydırarak ilerle.',sort:'Sağa kaydır: Biliyorum. Sola kaydır: Hâlâ öğreniyorum. Tur sonunda bilemediklerini tekrar çalış.',srs:'Kartı çevirdikten sonra ne kadar iyi hatırladığını seç: Tekrar, Zor, İyi, Kolay. Kart, hatırlama düzeyine göre dakikalar ya da günler sonra yeniden gelir.'};
    const upd=()=>{$('#o-md',b).textContent=desc[O.method];$('#o-srs',b).hidden=O.method!=='srs'};upd();
    let changed=false;const ch=()=>{changed=true;touchSet(set)};
    bindSeg(b,'o-m',v=>{O.method=v;upd();ch()});
    bindSeg(b,'o-f',v=>{O.front=v;ch()});
    $('#o-sh',b).addEventListener('change',e=>{O.shuffle=e.target.checked;ch();if(O.method==='sort')set.fcs=null});
    $('#o-st',b).addEventListener('change',e=>{O.starred=e.target.checked;ch()});
    $('#o-au',b).addEventListener('change',e=>{O.audio=e.target.checked;ch()});
    const np=$('#o-np',b);
    $$('[data-s]',b).forEach(x=>x.addEventListener('click',()=>{O.newPerDay=clamp((+np.value||0)+(+x.dataset.s),5,200);np.value=O.newPerDay;ch()}));
    np.addEventListener('change',()=>{O.newPerDay=clamp(+np.value||20,1,500);np.value=O.newPerDay;ch()});
    let reset=false;
    $('#o-reset',b).addEventListener('click',()=>{reset=true;s.close()});
    const s=sheet({title:'Kart seçenekleri',body:b,onClose:()=>{if(reset){set.fcs=null;if(O.method==='srs'){set.srs={};set.srsNew={}}touchSet(set);start(true);toast('Kartlar sıfırlandı')}else if(changed)start(false)}});
  }
  $('[data-opt]',el).addEventListener('click',options);
  push(scr,'cover');start(false);
}
</script>
<script>
/* =========================================================
   ÖĞREN — Quizlet Learn mantığı
   • Terim durumları: 0 Öğrenilmedi → 1 Öğreniliyor (yanlış) → 2 Tanıdık (1 doğru) → 3 Öğrenildi (2. doğru)
   • Yeni/yanlış terimler kolay soru (çoktan seçmeli, D/Y), tanıdık terimler zor soru (yazılı, kart)
   • Turlar 7 terim; yanlış bilinen terim aynı turda 2-3 soru sonra tekrar gelir
   • Tur sonunda ara ekran, 5 doğru üst üste = seri, “Cevabım doğruydu” ile düzeltme
   ========================================================= */
const LDEF={dir:'smart',mc:true,wr:true,tf:false,fc:false,shuffle:true,starred:false,audio:true,retype:false,grade:'lenient',size:7};
const PRAISE=['Harika!','Süper!','Mükemmel!','Aynen böyle!','Çok iyi!','Tam isabet!','Harikasın!','Bravo!'];
const CONSOLE=['Sorun değil, öğrenmek bir süreç!','Tam değil, öğrenmeye devam!','Bunu birazdan tekrar soracağım.','Hata yapmak öğrenmenin parçası!'];
function confetti(cv){
  if(!cv||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const ctx=cv.getContext('2d'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const cols=['#4255FF','#FFCD1F','#12A96B','#FF8A3D','#E5404F','#98A5FF'];
  const ps=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*80,y:H*.3,vx:(Math.random()-.5)*10,vy:-Math.random()*12-4,s:Math.random()*6+5,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:pick(cols)}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}if(t<240&&cv.isConnected)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})();
}
function openLearn(set){
  const O=set.lopt={...LDEF,...(set.lopt||{})};
  ACTIVE_SET=set.id;
  const el=h(`<section class="screen study"><header class="nav">${closeBtn}<div class="ctr" id="l-ctr">Öğren</div><div class="spacer"></div><span class="streakpill glass" id="l-streak" hidden>${ic('flame')}<span>0</span></span><button class="gbtn glass" data-opt aria-label="Seçenekler">${ic('sliders')}</button></header><div class="sbody" id="l-body"></div></section>`);
  const body=$('#l-body',el);
  let round=null,q=null,lock=false,streak=0,advT=0,snap=null;
  const scr={el,study:true,onClose(){ACTIVE_SET=null;clearTimeout(advT);document.removeEventListener('keydown',onKey)}};
  const byId=id=>set.cards.find(c=>c.id===id);
  const pool=()=>{let c=set.cards;if(O.starred){const s=c.filter(x=>x.star);if(s.length)c=s}return c};
  const P=c=>set.prog[c.id]||(set.prog[c.id]={s:0,c:0,w:0});

  function begin(){
    const cs=pool();
    if(cs.every(c=>stageOf(set,c)===3))return finish();
    if(!set.round&&cs.every(c=>stageOf(set,c)===0))return intro();
    newRound();
  }
  function intro(){
    $('#l-ctr',el).innerHTML='Öğren';$('#l-streak',el).hidden=true;
    body.innerHTML=`<div class="done">
      <h2>Öğren nasıl çalışır?</h2>
      <p class="lead">${pool().length} kelimeyi ${O.size}’şer terimlik turlarla, kolaydan zora doğru çalışacaksın.</p>
      <ol class="steps">
        <li><div><b>Önce tanı.</b> Yeni bir kelime ilk kez çoktan seçmeli soruyla gelir.</div></li>
        <li><div><b>Sonra kendin yaz.</b> Doğru bildiğin kelime sonraki turda yazılı soru olarak karşına çıkar.</div></li>
        <li><div><b>İki kez doğru = Öğrenildi.</b> Yanlış bildiğin kelime aynı turda tekrar sorulur ve yeniden çoktan seçmeliye döner.</div></li>
      </ol>
      <div class="btns"><button class="btn" data-go>Başla</button><button class="btn sec" data-o>${ic('sliders')} Seçenekler</button></div></div>`;
    $('[data-go]',body).addEventListener('click',newRound);
    $('[data-o]',body).addEventListener('click',options);
  }
  function newRound(){
    const cs=pool().filter(c=>stageOf(set,c)!==3);
    if(!cs.length)return finish();
    const s1=cs.filter(c=>stageOf(set,c)===1).sort((a,b)=>P(b).w-P(a).w);
    let s2=cs.filter(c=>stageOf(set,c)===2),s0=cs.filter(c=>stageOf(set,c)===0);
    if(O.shuffle){s2=shuffle(s2);s0=shuffle(s0)}
    const pk=s1.slice(0,O.size);let i=0,j=0;
    while(pk.length<O.size&&(i<s2.length||j<s0.length)){if(i<s2.length)pk.push(s2[i++]);if(pk.length<O.size&&j<s0.length)pk.push(s0[j++])}
    set.round=(set.round||0)+1;touchSet(set);
    const ids=(O.shuffle?shuffle(pk):pk).map(c=>c.id);
    round={n:set.round,terms:ids,queue:ids.slice(),done:new Set(),first:{}};
    nextQ();
  }
  function qtype(c){
    const s=stageOf(set,c);
    let easy=[O.mc&&'mc',O.tf&&'tf'].filter(Boolean);const hard=[O.wr&&'wr',O.fc&&'fc'].filter(Boolean);
    if(set.cards.length<2)easy=[];
    let list=s===2?(hard.length?hard:easy):(easy.length?easy:hard);
    if(!list.length)list=['fc'];
    if(list.length===2)return Math.random()<.72?list[0]:list[1];
    return list[0];
  }
  function ansSide(type){if(O.dir==='smart')return type==='wr'?'t':'d';if(O.dir==='mix')return Math.random()<.5?'t':'d';return O.dir==='term'?'t':'d'}
  function build(c){
    const type=qtype(c),a=ansSide(type),ps=a==='t'?'d':'t';
    const Q={c,type,a,prompt:c[ps],answer:c[a],pLang:ps==='t'?set.termLang:set.defLang,aLang:a==='t'?set.termLang:set.defLang};
    if(type==='mc'){Q.options=shuffle([c[a],...distractors(set,c,a,3)]);Q.correct=Q.options.indexOf(c[a])}
    if(type==='tf'){const w=distractors(set,c,a,1)[0];Q.truth=!w||Math.random()<.5;Q.shown=Q.truth?c[a]:w}
    return Q;
  }
  function header(){const c=counts(set,pool());$('#l-ctr',el).innerHTML=`Tur ${round.n}<small>${c.ms} / ${c.n} öğrenildi</small>`}
  function progHTML(){const t=round.terms.length,d=round.done.size;return`<div class="lp"><span class="num ${d?'g':''}" id="lp-d">${d}</span><div class="bar"><i id="lp-bar" style="width:${d/t*100}%"></i></div><span class="num">${t}</span></div>`}
  function updProg(){const t=round.terms.length,d=round.done.size;const n=$('#lp-d',el),b=$('#lp-bar',el);if(n){n.textContent=d;n.classList.toggle('g',d>0)}if(b)b.style.width=d/t*100+'%';header()}
  function updStreak(bump){const s=$('#l-streak',el);s.hidden=streak<5;$('span',s).textContent=streak;if(bump&&streak>=5){s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}}

  function nextQ(){
    clearTimeout(advT);lock=false;snap=null;
    if(!round)return begin();
    if(!round.queue.length)return checkpoint();
    const c=byId(round.queue[0]);if(!c){round.queue.shift();return nextQ()}
    q=build(c);render();
  }
  function render(){
    header();updStreak(false);
    const side=q.a==='t'?'Tanım':'Terim';
    let inner='';
    if(q.type==='mc')inner=`<div class="lq-sub">Doğru ${q.a==='t'?'terimi':'tanımı'} seç</div><div class="opts" id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="num">${i+1}</span><span class="otext">${esc(o)}</span></button>`).join('')}</div><button class="dk" data-dk>Bilmiyor musun?</button>`;
    else if(q.type==='tf')inner=`<div class="tf-cand"><div class="k">${q.a==='t'?'Terim':'Tanım'}</div><div>${esc(q.shown)}</div></div><div class="lq-sub">Bu eşleşme doğru mu?</div><div class="opts tf-grid" id="opts"><button class="opt" data-tf="1">${ic('check')} Doğru</button><button class="opt" data-tf="0">${ic('x')} Yanlış</button></div><button class="dk" data-dk>Bilmiyor musun?</button>`;
    else if(q.type==='wr')inner=`<div class="lq-sub">${q.a==='t'?'Terimi yaz':'Tanımı yaz'}</div><form id="wf" autocomplete="off"><input id="w-in" class="winput" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" lang="${esc(q.aLang)}" placeholder="Cevabını yaz" aria-label="Cevabın"><div class="w-acts"><button type="button" class="dk" data-dk>Bilmiyor musun?</button><button type="submit" class="btn sm">Cevapla</button></div></form>`;
    else inner=`<div class="lq-sub">Cevabı aklından söyle, sonra kartı çevir</div><button class="lfc" id="lfc">Cevabı görmek için dokun</button><div class="self" id="self" hidden><button class="btn warn" data-self="0">Bilemedim</button><button class="btn good" data-self="1">Bildim</button></div>`;
    body.innerHTML=`${progHTML()}<div class="lwrap" id="lw"><div class="lq"><div class="lq-label"><span>${side}</span><button class="icbtn" data-say aria-label="Seslendir">${ic('speaker')}</button></div><div class="lq-prompt ${sizeCls(q.prompt)}">${esc(q.prompt)}</div>${inner}</div></div><div class="fb glass" id="fb"></div>`;
    bindQ();
    if(O.audio&&q.pLang===set.termLang)TTS.speak(q.prompt,q.pLang);
  }
  function bindQ(){
    $('[data-say]',body).addEventListener('click',()=>TTS.speak(q.prompt,q.pLang));
    const dk=$('[data-dk]',body);dk&&dk.addEventListener('click',()=>{if(!lock)submit(false,{skip:true})});
    if(q.type==='mc')$$('#opts .opt',body).forEach(b=>b.addEventListener('click',()=>{if(lock)return;const i=+b.dataset.i;submit(i===q.correct,{i})}));
    if(q.type==='tf')$$('#opts .opt',body).forEach(b=>b.addEventListener('click',()=>{if(lock)return;const v=b.dataset.tf==='1';submit(v===q.truth,{tf:v})}));
    if(q.type==='wr'){
      const f=$('#wf',body),inp=$('#w-in',body);
      f.addEventListener('submit',e=>{e.preventDefault();if(lock)return;const v=inp.value.trim();if(!v){inp.focus();return}const g=grade(v,q.answer,O.grade);submit(g!=='no',{typed:v,close:g==='close'})});
      try{inp.focus({preventScroll:true})}catch(e){}
    }
    if(q.type==='fc'){
      const b=$('#lfc',body);
      b.addEventListener('click',()=>{if(b.classList.contains('open'))return;b.classList.add('open');b.textContent=q.answer;$('#self',body).hidden=false;if(O.audio&&q.aLang===set.termLang)TTS.speak(q.answer,q.aLang)});
      $$('[data-self]',body).forEach(x=>x.addEventListener('click',()=>{if(!lock)submit(x.dataset.self==='1',{self:true})}));
    }
  }
  function submit(ok,info){
    lock=true;const c=q.c;
    snap={p:{...P(c)},queue:round.queue.slice(),first:round.first[c.id],streak,done:round.done.has(c.id)};
    apply(ok);
    ok?fbOk(info):fbBad(info);
  }
  function apply(ok){
    const c=q.c,p=P(c);
    if(!(c.id in round.first))round.first[c.id]=ok;
    round.queue.shift();
    if(ok){p.c++;p.s=p.s>=2?3:2;streak++;round.done.add(c.id)}
    else{p.w++;p.s=1;streak=0;round.queue.splice(Math.min(round.queue.length,2+(Math.random()*2|0)),0,c.id)}
    p.t=now();markStudied(set);touchSet(set);updProg();updStreak(ok);
  }
  function override(){
    if(!snap)return;const c=q.c;
    set.prog[c.id]={...snap.p};round.queue=snap.queue;streak=snap.streak;
    if(snap.first===undefined)delete round.first[c.id];else round.first[c.id]=snap.first;
    if(!snap.done)round.done.delete(c.id);
    apply(true);toast('Doğru sayıldı');nextQ();
  }
  function showFb(inner){
    const fb=$('#fb',body);fb.innerHTML=inner;void fb.offsetWidth;fb.classList.add('show');
    const n=$('[data-next]',fb);n&&n.addEventListener('click',nextQ);
    const o=$('[data-ovr]',fb);o&&o.addEventListener('click',override);
  }
  function lockOpts(){const o=$('#opts',body);o&&o.classList.add('locked');const dk=$('[data-dk]',body);if(dk)dk.style.visibility='hidden'}
  function fbOk(info){
    haptic(8);lockOpts();
    if(q.type==='mc'){$$('#opts .opt',body).forEach((b,i)=>b.classList.add(i===q.correct?'ok':'dim'));$(`#opts .opt[data-i="${q.correct}"] .num`,body).innerHTML=ic('check')}
    if(q.type==='tf')$$('#opts .opt',body).forEach(b=>b.classList.add((b.dataset.tf==='1')===info.tf?'ok':'dim'));
    if(q.type==='wr'){const i=$('#w-in',body);i.classList.add('ok');i.readOnly=true;i.blur();$('.w-acts',body).style.visibility='hidden'}
    if(O.audio&&q.aLang===set.termLang)TTS.speak(q.answer,q.aLang);
    if(info.close){showFb(`<div class="fb-t w">${ic('check')} Neredeyse doğru!</div><div class="fb-note">Doğru yazımı: <b>${esc(q.answer)}</b></div><div class="btns"><button class="btn" data-next>Devam et</button></div>`);return}
    showFb(`<div class="fb-t g">${ic('check')} ${pick(PRAISE)}${streak>=5?` <span style="margin-left:auto;color:var(--warn);font-size:15px">${streak} doğru üst üste</span>`:''}</div><div class="btns"><button class="btn good" data-next>Devam et</button></div>`);
    advT=setTimeout(nextQ,q.type==='fc'?700:1400);
  }
  function fbBad(info){
    haptic(25);lockOpts();
    if(q.type==='mc'){
      $$('#opts .opt',body).forEach((b,i)=>b.classList.add(i===q.correct?'ok':i===info.i?'bad':'dim'));
      $(`#opts .opt[data-i="${q.correct}"] .num`,body).innerHTML=ic('check');
      if(info.i!=null)$(`#opts .opt[data-i="${info.i}"] .num`,body).innerHTML=ic('x');
    }
    if(q.type==='tf'){
      $$('#opts .opt',body).forEach(b=>{const v=b.dataset.tf==='1';b.classList.add(v===q.truth?'ok':v===info.tf?'bad':'dim')});
      if(!q.truth)$('.lq',body).insertAdjacentHTML('beforeend',`<div class="cmp ok"><div class="k">Doğru eşleşme</div><div class="v">${esc(q.answer)}</div></div>`);
    }
    if(q.type==='wr'){
      $('#wf',body).outerHTML=`<div class="cmp bad ${info.skip?'skip':''}"><div class="k">${info.skip?'Atlandı':'Senin cevabın'}</div><div class="v">${info.skip?'—':esc(info.typed)}</div></div>
        <div class="cmp ok"><div class="k">Doğru cevap</div><div class="v"><span>${esc(q.answer)}</span><button class="icbtn" data-say2 aria-label="Seslendir">${ic('speaker')}</button></div></div>
        ${O.retype?`<div class="lq-sub" style="margin-top:16px">Pekiştirmek için doğru cevabı yaz</div><input id="rt-in" class="winput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" lang="${esc(q.aLang)}" placeholder="${esc(q.answer)}" aria-label="Doğru cevabı yaz">`:''}`;
      $('[data-say2]',body).addEventListener('click',()=>TTS.speak(q.answer,q.aLang));
    }
    if(q.type==='fc'&&!$('#lfc',body).classList.contains('open')){const b=$('#lfc',body);b.classList.add('open');b.textContent=q.answer}
    const ovr=q.type==='wr'&&!info.skip;const rt=O.retype&&q.type==='wr';
    showFb(`<div class="fb-t b">${ic('x')} ${pick(CONSOLE)}</div><div class="btns ${ovr?'two':''}">${ovr?'<button class="btn sec" data-ovr>Cevabım doğruydu</button>':''}<button class="btn" data-next ${rt?'disabled':''}>Devam et</button></div>`);
    if(rt){const r=$('#rt-in',body),n=$('#fb [data-next]',body);
      r.addEventListener('input',()=>{const okk=grade(r.value,q.answer,'lenient')!=='no';n.disabled=!okk;r.classList.toggle('ok',okk)});
      r.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!n.disabled)nextQ()}});
      setTimeout(()=>{try{r.focus({preventScroll:true})}catch(e){}},60);
    }
    if(O.audio&&q.aLang===set.termLang)setTimeout(()=>TTS.speak(q.answer,q.aLang),250);
  }
  function checkpoint(){
    const cs=pool();const c=counts(set,cs);
    if(c.ms===c.n)return finish();
    $('#l-ctr',el).innerHTML=`Tur ${round.n}<small>tamamlandı</small>`;
    body.innerHTML=`<div class="done" style="padding-bottom:calc(var(--safe-b) + 110px)">
      <h2>${pick(['Harika gidiyorsun!','Böyle devam!','Süper bir tur!','Momentumu koru!','Çok iyi ilerliyorsun!'])}</h2>
      <p class="lead">${c.ms} / ${c.n} terim öğrenildi. Sıradaki turda tanıdık kelimeleri yazarak pekiştireceksin.</p>
      <div class="ringrow"><div class="ring">${ringSVG(c.ms/c.n)}<b>%${Math.round(c.ms/c.n*100)}</b></div>
        <div class="stat-list"><div class="stat k"><span>Öğrenildi</span><span>${c.ms}</span></div><div class="stat l"><span>Öğreniliyor</span><span>${c.lr}</span></div><div class="stat n"><span>Öğrenilmedi</span><span>${c.ns}</span></div></div></div>
      <div class="sh" style="margin-top:4px;font-size:18px">Bu turda çalışılan terimler</div>
      <div class="group">${round.terms.map(id=>{const x=byId(id);if(!x)return'';const ok=round.first[id];const st=stageOf(set,x);
        return`<div class="row cp-item"><span class="st ${ok?'g':'w'}" title="${ok?'İlk denemede doğru':'Tekrar edildi'}">${ic(ok?'check':'refresh')}</span><div class="grow"><div class="tt">${esc(x.t)}</div><div class="dd">${esc(x.d)}</div></div><span class="badge" style="${st===3?'background:var(--good-soft);color:var(--good)':'background:var(--warn-soft);color:var(--warn)'}">${st===3?'Öğrenildi':'Öğreniliyor'}</span></div>`}).join('')}</div>
    </div><div class="sticky-cta"><button class="btn" data-cont>Devam et</button></div>`;
    $('[data-cont]',body).addEventListener('click',newRound);
  }
  function finish(){
    const n=pool().length;$('#l-ctr',el).innerHTML='Öğren';$('#l-streak',el).hidden=true;
    body.innerHTML=`<canvas id="confetti"></canvas><div class="done"><div class="bigbadge">${ic('check')}</div><h2>Tebrikler! Tüm terimleri öğrendin.</h2><p class="lead">${n} terimin hepsi “Öğrenildi” durumunda. Kalıcı olması için birkaç gün sonra Test ile kendini yokla.</p>
      <div class="btns" style="margin-top:24px"><button class="btn" data-test>${ic('test')} Test ile kendini dene</button><button class="btn sec" data-fc>${ic('cards')} Kartlarla tekrar et</button><button class="btn ghost" data-reset>${ic('refresh')} Öğren’i baştan başlat</button></div></div>`;
    requestAnimationFrame(()=>confetti($('#confetti',body)));
    $('[data-test]',body).addEventListener('click',()=>{pop();setTimeout(()=>openTest(set),60)});
    $('[data-fc]',body).addEventListener('click',()=>{pop();setTimeout(()=>openFlashcards(set),60)});
    $('[data-reset]',body).addEventListener('click',resetLearn);
  }
  async function resetLearn(){
    if(!await ask({title:'Öğren baştan başlasın mı?',msg:'Bu setteki Öğren ilerlemen sıfırlanır.',ok:'Baştan başlat',danger:true}))return false;
    for(const c of set.cards)delete set.prog[c.id];set.round=0;round=null;streak=0;touchSet(set);begin();return true;
  }
  function options(){
    const snapO=JSON.stringify(O);let reset=false;
    const b=h(`<div>
      <div class="opt-label">Cevap verme şekli</div>
      ${segHTML('lo-d',[['smart','Akıllı'],['term','Terim'],['def','Tanım'],['mix','Karışık']],O.dir)}
      <p class="opt-desc" id="lo-dd"></p>
      <div class="opt-label">Soru türleri</div>
      <div class="group">${swRow('lo-mc','Çoktan seçmeli',O.mc)}${swRow('lo-wr','Yazılı',O.wr)}${swRow('lo-tf','Doğru / Yanlış',O.tf)}${swRow('lo-fc','Kartlar',O.fc,'Kartı çevirip kendini değerlendirirsin')}</div>
      <p class="opt-desc">Yeni terimler kolay türlerle (çoktan seçmeli, doğru/yanlış), bir kez doğru bildiğin terimler zor türlerle (yazılı, kartlar) sorulur.</p>
      <div class="opt-label">Yazılı cevap değerlendirme</div>
      ${segHTML('lo-g',[['lenient','Esnek'],['strict','Katı']],O.grade)}
      <p class="opt-desc" id="lo-gd"></p>
      <div class="group" style="margin-top:12px">${swRow('lo-rt','Yanlış cevaptan sonra doğrusunu yaz',O.retype)}</div>
      <div class="opt-label">Tur uzunluğu</div>
      ${segHTML('lo-s',[['5','5 terim'],['7','7 terim'],['10','10 terim']],O.size)}
      <div class="opt-label">Diğer</div>
      <div class="group">${swRow('lo-sh','Terimleri karıştır',O.shuffle)}${swRow('lo-st','Sadece yıldızlı terimler',O.starred,set.cards.filter(c=>c.star).length+' yıldızlı terim')}${swRow('lo-au','Sesli okuma',O.audio,'Terimleri otomatik seslendir')}</div>
      <button class="btn sec" id="lo-reset" style="margin-top:22px;color:var(--bad)">${ic('refresh')} Öğren’i baştan başlat</button>
    </div>`);
    const dd={smart:'Çoktan seçmelide terimi (İngilizce kelimeyi) görüp anlamını seçersin; yazılıda anlamı görüp terimi yazarsın. Dil öğrenmek için önerilir.',term:'Tanımı görürsün, terimle cevap verirsin.',def:'Terimi görürsün, tanımla cevap verirsin.',mix:'Her soruda yön rastgele seçilir.'};
    const gd={lenient:'Büyük/küçük harf, noktalama, “to / the” gibi ekler ve küçük yazım hataları kabul edilir; yazım hatasında doğru yazımı gösterir.',strict:'Tam eşleşme gerekir; yalnızca büyük/küçük harf ve noktalama farkı kabul edilir.'};
    const upd=()=>{$('#lo-dd',b).textContent=dd[O.dir];$('#lo-gd',b).textContent=gd[O.grade]};upd();
    bindSeg(b,'lo-d',v=>{O.dir=v;upd()});bindSeg(b,'lo-g',v=>{O.grade=v;upd()});bindSeg(b,'lo-s',v=>{O.size=+v});
    const sw=(id,k)=>$('#'+id,b).addEventListener('change',e=>{O[k]=e.target.checked});
    sw('lo-mc','mc');sw('lo-wr','wr');sw('lo-tf','tf');sw('lo-fc','fc');sw('lo-rt','retype');sw('lo-sh','shuffle');sw('lo-st','starred');sw('lo-au','audio');
    $('#lo-reset',b).addEventListener('click',()=>{reset=true;s.close()});
    const before=O.starred;
    const s=sheet({title:'Öğren seçenekleri',body:b,full:true,onClose:()=>{
      if(!O.mc&&!O.wr&&!O.tf&&!O.fc){O.mc=true;toast('En az bir soru türü açık olmalı')}
      if(JSON.stringify(O)!==snapO)touchSet(set);
      if(reset){resetLearn();return}
      if(O.starred!==before){round=null;begin();return}
      if(JSON.stringify(O)!==snapO&&round&&q&&!lock&&round.queue.length){q=build(q.c);render()}
    }});
  }
  function onKey(e){
    if(Nav.stack[Nav.stack.length-1]!==scr||$('.sheet-wrap')||$('.alert-wrap'))return;
    const fb=$('#fb',body);
    if(e.key==='Enter'&&fb&&fb.classList.contains('show')){const n=$('[data-next]',fb);if(n&&!n.disabled&&(!document.activeElement||document.activeElement.id!=='rt-in')){e.preventDefault();n.click()}return}
    if(!lock&&q&&q.type==='mc'&&/^[1-4]$/.test(e.key)&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){const b=$(`#opts .opt[data-i="${+e.key-1}"]`,body);b&&b.click()}
  }
  document.addEventListener('keydown',onKey);
  $('[data-opt]',el).addEventListener('click',options);
  push(scr,'cover');begin();
}
</script>
<script>
/* =========================================================
   TEST — Doğru/Yanlış, Çoktan seçmeli, Eşleştirme, Yazılı
   ========================================================= */
const TDEF={n:20,dir:'smart',tf:true,mc:true,mt:false,wr:true,starred:false,instant:false};
const SEC={tf:'Doğru / Yanlış',mc:'Çoktan seçmeli',mt:'Eşleştirme',wr:'Yazılı'};
function openTest(set){
  const O=set.topt={...TDEF,...(set.topt||{})};
  ACTIVE_SET=set.id;
  const el=h(`<section class="screen study"><header class="nav">${closeBtn}<div class="ctr" id="t-ctr">Test</div><div class="spacer"></div><button class="gbtn glass" data-opt aria-label="Testi ayarla">${ic('sliders')}</button></header><div class="sbody"><div class="lwrap" id="t-body" style="padding-bottom:calc(var(--safe-b) + 40px)"></div></div></section>`);
  const body=$('#t-body',el);
  let Qs=[],t0=0,submitted=false,total=0,selChip=null,actSlot=null;
  const scr={el,study:true,onClose(){ACTIVE_SET=null},
    async close(){if(Qs.length&&!submitted&&answeredN()>0&&!await ask({title:'Testten çıkılsın mı?',msg:'Testteki cevapların kaydedilmez.',ok:'Çık',cancel:'Teste dön',danger:true}))return;pop()}};
  const pool=()=>{let c=set.cards;if(O.starred){const s=c.filter(x=>x.star);if(s.length)c=s}return c};
  const aside=t=>O.dir==='smart'?(t==='wr'?'t':'d'):O.dir==='mix'?(Math.random()<.5?'t':'d'):O.dir==='term'?'t':'d';

  function setup(){
    submitted=false;Qs=[];selChip=actSlot=null;
    const max=pool().length;O.n=clamp(O.n,1,max);
    $('#t-ctr',el).innerHTML='Test';
    body.innerHTML=`<h2 style="font-size:28px;margin:4px 4px 4px">Testini ayarla</h2><p class="lsub">${esc(set.title)}</p>
      <div class="group setup"><div class="row"><span class="grow">Soru sayısı<div class="rsub">En fazla ${max}</div></span><div class="stepper"><button data-s="-1" aria-label="Azalt">−</button><input id="t-n" inputmode="numeric" value="${O.n}" aria-label="Soru sayısı"><button data-s="1" aria-label="Artır">+</button></div></div></div>
      <div class="opt-label">Cevap verme şekli</div>
      ${segHTML('t-d',[['smart','Akıllı'],['term','Terim'],['def','Tanım'],['mix','Karışık']],O.dir)}
      <div class="opt-label">Soru türleri</div>
      <div class="group">${swRow('t-tf','Doğru / Yanlış',O.tf)}${swRow('t-mc','Çoktan seçmeli',O.mc)}${swRow('t-mt','Eşleştirme',O.mt)}${swRow('t-wr','Yazılı',O.wr)}</div>
      <div class="opt-label">Diğer</div>
      <div class="group">${swRow('t-in','Anında geri bildirim',O.instant,'Her cevaptan sonra doğru mu yanlış mı göster')}${swRow('t-st','Sadece yıldızlı terimler',O.starred,set.cards.filter(c=>c.star).length+' yıldızlı terim')}</div>
      <button class="btn" data-start style="margin-top:22px">Testi başlat</button>`;
    const n=$('#t-n',body);
    $$('[data-s]',body).forEach(b=>b.addEventListener('click',()=>{O.n=clamp((+n.value||0)+(+b.dataset.s),1,pool().length);n.value=O.n}));
    n.addEventListener('change',()=>{O.n=clamp(+n.value||1,1,pool().length);n.value=O.n});
    bindSeg(body,'t-d',v=>O.dir=v);
    [['t-tf','tf'],['t-mc','mc'],['t-mt','mt'],['t-wr','wr'],['t-in','instant']].forEach(([id,k])=>$('#'+id,body).addEventListener('change',e=>O[k]=e.target.checked));
    $('#t-st',body).addEventListener('change',e=>{O.starred=e.target.checked;setup()});
    $('[data-start]',body).addEventListener('click',()=>{
      if(!O.tf&&!O.mc&&!O.mt&&!O.wr){toast('En az bir soru türü seç');return}
      touchSet(set);generate();renderTest();body.scrollTo({top:0});
    });
  }
  function generate(){
    const cards=shuffle(pool()).slice(0,O.n);total=cards.length;
    let types=['tf','mc','mt','wr'].filter(t=>O[t]);
    if(set.cards.length<2)types=['wr'];
    const cnt={};types.forEach(t=>cnt[t]=0);for(let k=0;k<total;k++)cnt[types[k%types.length]]++;
    if(cnt.mt===1&&types.length>1){cnt.mt=0;cnt[types.find(t=>t!=='mt')]++}
    Qs=[];let ci=0,no=1;
    for(const t of types){
      const cs=cards.slice(ci,ci+cnt[t]);ci+=cnt[t];if(!cs.length)continue;
      if(t==='mt'){
        const groups=[];for(let k=0;k<cs.length;k+=6)groups.push(cs.slice(k,k+6));
        if(groups.length>1&&groups[groups.length-1].length===1)groups[groups.length-2].push(...groups.pop());
        for(const g of groups){const a=aside('mt');const items=g.map(c=>({c,prompt:a==='t'?c.d:c.t,answer:c[a]}));Qs.push({type:'mt',sec:'mt',items,choices:shuffle(items.map(x=>x.answer)),user:{},no});no+=g.length}
      }else for(const c of cs){
        const a=aside(t),ps=a==='t'?'d':'t';
        const Q={type:t,sec:t,c,a,prompt:c[ps],answer:c[a],lang:a==='t'?set.termLang:set.defLang,no:no++,user:null};
        if(t==='mc'){Q.options=shuffle([c[a],...distractors(set,c,a,3)]);Q.correct=Q.options.indexOf(c[a])}
        if(t==='tf'){const w=distractors(set,c,a,1)[0];Q.truth=!w||Math.random()<.5;Q.shown=Q.truth?c[a]:w}
        Qs.push(Q);
      }
    }
    t0=now();
  }
  const isAns=q=>q.type==='mt'?Object.keys(q.user).length:(q.type==='wr'?(q.user&&q.user.trim()?1:0):(q.user!=null?1:0));
  const answeredN=()=>Qs.reduce((a,q)=>a+isAns(q),0);
  function updCount(){$('#t-ctr',el).innerHTML=submitted?'Sonuçlar':`${answeredN()} / ${total}<small>cevaplandı</small>`}
  function gradeQ(q){
    if(q.type==='tf')q.ok=q.user===q.truth;
    else if(q.type==='mc')q.ok=q.user===q.correct;
    else if(q.type==='wr'){const g=grade(q.user||'',q.answer,'lenient');q.ok=g!=='no';q.close=g==='close'}
    else q.okN=q.items.filter((it,j)=>q.user[j]!=null&&fold(q.choices[q.user[j]],false)===fold(it.answer,false)).length;
  }
  function qHTML(q){
    const i=Qs.indexOf(q);const show=submitted||(O.instant&&q.done);
    const numTxt=q.type==='mt'?`${q.no}–${q.no+q.items.length-1} / ${total}`:`${q.no} / ${total}`;
    let res='';
    if(show)res=q.type==='mt'?`<span class="res ${q.okN===q.items.length?'g':'b'}">${q.okN}/${q.items.length} doğru</span>`:`<span class="res ${q.ok?'g':'b'}">${q.ok?'Doğru':'Yanlış'}</span>`;
    let inner='';
    if(q.type==='tf'){
      inner=`<div class="lq-prompt ${sizeCls(q.prompt)}">${esc(q.prompt)}</div><div class="tf-cand"><div class="k">${q.a==='t'?'Terim':'Tanım'}</div><div>${esc(q.shown)}</div></div>
        <div class="opts tf-grid ${show?'locked':''}">${[1,0].map(v=>{const val=!!v;let c='';if(show)c=val===q.truth?'ok':q.user===val?'bad':'dim';else if(q.user===val)c='picked';return`<button class="opt ${c}" data-tf="${v}">${ic(v?'check':'x')} ${v?'Doğru':'Yanlış'}</button>`}).join('')}</div>
        ${show&&!q.truth?`<div class="cmp ok"><div class="k">Doğru eşleşme</div><div class="v">${esc(q.answer)}</div></div>`:''}`;
    }else if(q.type==='mc'){
      inner=`<div class="lq-prompt ${sizeCls(q.prompt)}">${esc(q.prompt)}</div><div class="lq-sub">Doğru ${q.a==='t'?'terimi':'tanımı'} seç</div>
        <div class="opts ${show?'locked':''}">${q.options.map((o,k)=>{let c='';if(show)c=k===q.correct?'ok':k===q.user?'bad':'dim';else if(q.user===k)c='picked';return`<button class="opt ${c}" data-mc="${k}"><span class="num">${show&&k===q.correct?ic('check'):show&&k===q.user?ic('x'):k+1}</span><span class="otext">${esc(o)}</span></button>`}).join('')}</div>`;
    }else if(q.type==='wr'){
      inner=`<div class="lq-prompt ${sizeCls(q.prompt)}">${esc(q.prompt)}</div>`+(show
        ?`<div class="cmp ${q.ok?'ok':'bad'} ${q.user&&q.user.trim()?'':'skip'}"><div class="k">Senin cevabın${q.close?' · küçük yazım hatası':''}</div><div class="v">${esc(q.user&&q.user.trim()?q.user:'—')}</div></div>${q.ok&&!q.close?'':`<div class="cmp ok"><div class="k">Doğru cevap</div><div class="v">${esc(q.answer)}</div></div>`}`
        :`<input class="winput" data-wr="${i}" value="${esc(q.user||'')}" placeholder="Cevabını yaz" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" lang="${esc(q.lang)}" aria-label="Soru ${q.no} cevabı">`);
    }else{
      inner=(show?'':'<p class="lq-sub" style="margin-top:2px">Aşağıdan bir cevap seç, sonra ilgili kutuya dokun.</p>')
        +q.items.map((it,j)=>{const u=q.user[j];const right=u!=null&&fold(q.choices[u],false)===fold(it.answer,false);let c=u!=null?'filled':'';if(show)c+=right?' ok':' bad';else if(actSlot&&actSlot.q===i&&actSlot.j===j)c+=' act';
          return`<div class="mt-row"><div class="mt-p">${esc(it.prompt)}</div><button class="mt-slot ${c}" data-slot="${j}">${u!=null?`<b>${'ABCDEFGH'[u]}</b><span>${esc(q.choices[u])}</span>`:'Cevabı buraya yerleştir'}</button>${show&&!right?`<div class="mt-fix">Doğru cevap: ${esc(it.answer)}</div>`:''}</div>`}).join('')
        +(show?'':`<div class="mt-choices">${q.choices.map((ch,k)=>{const used=Object.values(q.user).includes(k);return`<button class="mt-chip ${used?'used':''} ${selChip&&selChip.q===i&&selChip.k===k?'sel':''}" data-chip="${k}"><b>${'ABCDEFGH'[k]}</b><span>${esc(ch)}</span></button>`}).join('')}</div>`);
    }
    return`<div class="tq" data-q="${i}" id="tq-${i}"><div class="tq-h"><span>${q.type==='mt'?'Eşleştirme':(q.a==='t'?'Tanım':'Terim')} · ${numTxt}</span>${res}</div>${inner}</div>`;
  }
  function score(){let ok=0;for(const q of Qs)ok+=q.type==='mt'?q.okN:(q.ok?1:0);return ok}
  function resultsHTML(){
    const ok=score(),bad=total-ok,p=total?ok/total:0,mins=Math.max(1,Math.round((now()-t0)/60000));
    const msg=p>=.9?'Mükemmel iş!':p>=.7?'Çok iyi gidiyorsun!':p>=.5?'Fena değil, devam!':'Pratik yapmaya devam!';
    return`<div class="card t-res"><div class="ringrow" style="margin:2px 0 0;gap:16px"><div class="ring">${ringSVG(p,p>=.5?'var(--good)':'var(--warn)')}<b>%${Math.round(p*100)}</b></div><div class="grow"><h2>${msg}</h2><p class="pillsum">${ic('clock')} ${mins} dakika</p></div></div>
      <div class="stat-list" style="grid-template-columns:1fr 1fr;margin-top:16px"><div class="stat k"><span>Doğru</span><span>${ok}</span></div><div class="stat b"><span>Yanlış</span><span>${bad}</span></div></div>
      <div class="next"><div class="opt-label" style="margin:4px 4px 0">Sonraki adımlar</div>${bad?`<button class="btn" data-miss>${ic('learn')} Yanlışları Öğren’de çalış</button>`:''}<button class="btn ${bad?'sec':''}" data-new>Yeni test</button></div></div>
      <div class="sh">Cevapların</div>`;
  }
  function renderTest(){
    const secs=['tf','mc','mt','wr'].filter(s=>Qs.some(q=>q.sec===s));
    body.innerHTML=(submitted?resultsHTML():`<h1 class="ltitle" style="font-size:28px">${esc(set.title)}</h1><p class="lsub">${total} soru · ${secs.map(s=>SEC[s]).join(', ')}</p>`)
      +secs.map(s=>{const qs=Qs.filter(q=>q.sec===s);const n=qs.reduce((a,q)=>a+(q.type==='mt'?q.items.length:1),0);return`<div class="t-sec"><div class="t-sec-h">${SEC[s]}<span>${n} soru</span></div>${qs.map(qHTML).join('')}</div>`}).join('')
      +(submitted?`<button class="btn" data-new style="margin-top:12px">Yeni test</button>`:`<div class="card t-submit" style="margin-top:22px"><h3>Hepsi bu kadar! Testini göndermeye hazır mısın?</h3><button class="btn" data-submit>Testi gönder</button></div>`);
    updCount();
  }
  function reQ(i){const o=$('#tq-'+i,body);if(o)o.outerHTML=qHTML(Qs[i])}
  function answered(i,scroll){
    const q=Qs[i];
    if(O.instant){gradeQ(q);q.done=true;haptic(q.type==='mt'?8:(q.ok?8:25))}
    reQ(i);updCount();
    if(scroll)setTimeout(()=>{const j=Qs.findIndex((x,k)=>k>i&&!isAns(x));const t=j>=0?$('#tq-'+j,body):$('.t-submit',body);t&&t.scrollIntoView({behavior:'smooth',block:'center'})},280);
  }
  function assign(i,j,k){const q=Qs[i];for(const key in q.user)if(q.user[key]===k)delete q.user[key];q.user[j]=k;if(Object.keys(q.user).length===q.items.length)answered(i,false);else{reQ(i);updCount()}}
  async function submitTest(){
    const un=total-answeredN();
    if(un>0&&!await ask({title:`${un} soru cevapsız`,msg:'Cevapsız sorular yanlış sayılır. Yine de göndermek istiyor musun?',ok:'Gönder',cancel:'Teste dön'}))return;
    $$('[data-wr]',body).forEach(w=>{Qs[+w.dataset.wr].user=w.value});
    Qs.forEach(gradeQ);submitted=true;markStudied(set);touchSet(set);
    renderTest();body.scrollTo({top:0,behavior:'smooth'});
    if(score()/total>=.9){const cv=h('<canvas id="confetti"></canvas>');el.appendChild(cv);requestAnimationFrame(()=>confetti(cv));setTimeout(()=>cv.remove(),5000)}
  }
  body.addEventListener('click',e=>{
    if(e.target.closest('[data-submit]'))return submitTest();
    if(e.target.closest('[data-new]'))return setup();
    if(e.target.closest('[data-miss]')){
      const miss=new Set();
      for(const q of Qs){if(q.type==='mt')q.items.forEach((it,j)=>{const u=q.user[j];if(!(u!=null&&fold(q.choices[u],false)===fold(it.answer,false)))miss.add(it.c.id)});else if(!q.ok)miss.add(q.c.id)}
      for(const c of set.cards)if(miss.has(c.id)){c.star=true;const p=set.prog[c.id];if(p&&p.s===3)p.s=1}
      set.lopt={...LDEF,...(set.lopt||{}),starred:true};touchSet(set);
      toast(miss.size+' terim yıldızlandı');pop();setTimeout(()=>openLearn(set),80);return;
    }
    const tq=e.target.closest('.tq');if(!tq||submitted)return;
    const i=+tq.dataset.q,q=Qs[i];if(O.instant&&q.done)return;
    const tf=e.target.closest('[data-tf]');if(tf){q.user=tf.dataset.tf==='1';answered(i,true);return}
    const mc=e.target.closest('[data-mc]');if(mc){q.user=+mc.dataset.mc;answered(i,true);return}
    const chip=e.target.closest('[data-chip]');
    if(chip){const k=+chip.dataset.chip;if(actSlot&&actSlot.q===i){const j=actSlot.j;actSlot=selChip=null;assign(i,j,k)}else{selChip=selChip&&selChip.q===i&&selChip.k===k?null:{q:i,k};reQ(i)}return}
    const slot=e.target.closest('[data-slot]');
    if(slot){const j=+slot.dataset.slot;if(selChip&&selChip.q===i){const k=selChip.k;selChip=actSlot=null;assign(i,j,k)}else if(q.user[j]!=null){delete q.user[j];actSlot=null;reQ(i);updCount()}else{actSlot=actSlot&&actSlot.q===i&&actSlot.j===j?null:{q:i,j};reQ(i)}}
  });
  body.addEventListener('input',e=>{const w=e.target.closest('[data-wr]');if(w){Qs[+w.dataset.wr].user=w.value;updCount()}});
  body.addEventListener('keydown',e=>{const w=e.target.closest('[data-wr]');if(!w||e.key!=='Enter')return;e.preventDefault();const i=+w.dataset.wr;Qs[i].user=w.value;
    const nx=Qs.findIndex((x,k)=>k>i&&x.type==='wr'&&!isAns(x));
    if(O.instant&&w.value.trim())answered(i,false);
    if(nx>=0){const n=$(`[data-wr="${nx}"]`,body);n&&n.focus()}else{w.blur();const t=$('.t-submit',body);t&&t.scrollIntoView({behavior:'smooth',block:'center'})}});
  body.addEventListener('focusout',e=>{const w=e.target.closest('[data-wr]');if(w&&O.instant&&w.value.trim()){const i=+w.dataset.wr;if(!Qs[i].done){Qs[i].user=w.value;setTimeout(()=>answered(i,false),0)}}});
  $('[data-opt]',el).addEventListener('click',async()=>{if(Qs.length&&!submitted&&answeredN()>0&&!await ask({title:'Test yeniden ayarlansın mı?',msg:'Bu testteki cevapların silinir.',ok:'Yeniden ayarla'}))return;setup()});
  push(scr,'cover');setup();
}

/* =========================================================
   EŞLEŞTİR — 6 çift, süre + her hata 1 sn ceza
   ========================================================= */
function openMatch(set){
  ACTIVE_SET=set.id;
  const el=h(`<section class="screen study"><header class="nav">${closeBtn}<div class="ctr" id="m-ctr">Eşleştir</div><div class="spacer"></div></header><div class="sbody" id="m-body"></div></section>`);
  const body=$('#m-body',el);
  let tiles=[],sel=null,t0=0,pen=0,raf=0,left=0,busy=false;
  const scr={el,study:true,onClose(){ACTIVE_SET=null;cancelAnimationFrame(raf)}};
  function ready(){
    cancelAnimationFrame(raf);
    body.innerHTML=`<div class="center-stage"><div class="art">${ic('match')}</div><h2>Oynamaya hazır mısın?</h2><p>Tüm terimleri tanımlarıyla olabildiğince hızlı eşleştir. Dikkat: her yanlış eşleşme süreye 1 saniye ekler!${set.best?`<br><br>${ic('trophy')} En iyi süren: <b>${set.best.toFixed(1)} sn</b>`:''}</p><button class="btn" data-go>Oyunu başlat</button></div>`;
    $('[data-go]',body).addEventListener('click',start);
  }
  function start(){
    const cs=shuffle(set.cards).slice(0,6);
    tiles=shuffle(cs.flatMap(c=>[{k:c.id,s:'t',x:c.t},{k:c.id,s:'d',x:c.d}])).map((t,i)=>({...t,i}));
    left=tiles.length;sel=null;pen=0;busy=false;
    body.innerHTML=`<div class="m-top"><span class="m-time" id="m-t">0.0</span><span class="muted">sn</span></div><div class="mgrid" style="grid-template-rows:repeat(${Math.ceil(tiles.length/3)},1fr)">${tiles.map(t=>`<button class="mtile ${t.x.length>60?'xs':t.x.length>26?'s':''}" data-t="${t.i}">${esc(t.x)}</button>`).join('')}</div>`;
    t0=performance.now();
    const tick=()=>{const tt=$('#m-t',body);if(tt)tt.textContent=((performance.now()-t0)/1000+pen).toFixed(1);raf=requestAnimationFrame(tick)};tick();
    $$('.mtile',body).forEach(b=>b.addEventListener('click',()=>tap(b)));
  }
  function tap(b){
    if(busy||b.classList.contains('gone'))return;const t=tiles[+b.dataset.t];
    if(!sel){sel={t,b};b.classList.add('sel');haptic(5);return}
    if(sel.t===t){b.classList.remove('sel');sel=null;return}
    const a=sel;sel=null;
    if(a.t.k===t.k&&a.t.s!==t.s){
      a.b.classList.remove('sel');a.b.classList.add('ok');b.classList.add('ok');haptic(10);
      setTimeout(()=>{a.b.classList.add('gone');b.classList.add('gone')},160);
      left-=2;if(!left)setTimeout(done,420);
    }else{
      busy=true;pen+=1;haptic(30);a.b.classList.remove('sel');a.b.classList.add('bad');b.classList.add('bad');
      const f=h('<div class="m-pen">+1 sn</div>');el.appendChild(f);setTimeout(()=>f.remove(),850);
      setTimeout(()=>{a.b.classList.remove('bad');b.classList.remove('bad');busy=false},430);
    }
  }
  function done(){
    cancelAnimationFrame(raf);const total=(performance.now()-t0)/1000+pen;
    const prev=set.best,rec=!prev||total<prev;if(rec)set.best=total;markStudied(set);touchSet(set);
    body.innerHTML=`<canvas id="confetti"></canvas><div class="center-stage"><div class="art" style="background:var(--good-soft);color:var(--good)">${ic(rec?'trophy':'check')}</div><h2>${rec?(prev?'Yeni rekor!':'İlk skorun hazır!'):'Tebrikler!'}</h2>
      <p>Süren: <b style="color:var(--text);font-size:22px">${total.toFixed(1)} sn</b>${pen?` (${pen} sn ceza dahil)`:''}<br>${prev?(rec?`Önceki rekorun ${prev.toFixed(1)} sn idi.`:`En iyi süren ${prev.toFixed(1)} sn.`):'Tekrar oynayıp süreni düşürmeye çalış.'}</p>
      <div class="btns"><button class="btn" data-go>Tekrar oyna</button><button class="btn sec" data-learn>${ic('learn')} Öğren’e geç</button></div></div>`;
    if(rec)requestAnimationFrame(()=>confetti($('#confetti',body)));
    $('[data-go]',body).addEventListener('click',start);
    $('[data-learn]',body).addEventListener('click',()=>{pop();setTimeout(()=>openLearn(set),60)});
  }
  push(scr,'cover');ready();
}

/* =========================================================
   Açılış
   ========================================================= */
function rrect(x,a,b,w,hh,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+hh,r);x.arcTo(a+w,b+hh,a,b+hh,r);x.arcTo(a,b+hh,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function makeIcon(){
  if(document.querySelector('link[rel="apple-touch-icon"]'))return;   // depoda gercek simge dosyasi var
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#5B6BFF');g.addColorStop(1,'#2F3FE0');x.fillStyle=g;x.fillRect(0,0,180,180);
    x.save();x.translate(100,80);x.rotate(.2);x.fillStyle='rgba(255,255,255,.42)';rrect(x,-44,-31,88,62,13);x.fill();x.restore();
    x.save();x.translate(84,100);x.rotate(-.09);x.fillStyle='#fff';rrect(x,-48,-33,96,66,14);x.fill();
    x.fillStyle='#FFCD1F';rrect(x,-32,-10,44,11,5.5);x.fill();x.fillStyle='#C9CFFF';rrect(x,-32,7,62,9,4.5);x.fill();x.restore();
    const u=c.toDataURL('image/png');
    for(const rel of['apple-touch-icon','icon']){const l=document.createElement('link');l.rel=rel;l.href=u;document.head.appendChild(l)}
  }catch(e){}
}
function positionLens(){const on=$('.tab.on'),lens=$('.tablens');if(on&&lens){lens.style.left=on.offsetLeft+'px';lens.style.width=on.offsetWidth+'px'}}
/* Ana ekrana eklendiginde internetsiz calismasi icin sayfayi telefona kaydeder */
function offlineReady(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Yeni sürüm hazır · uygulamayı kapatıp aç')});
    });
  }).catch(()=>{});
}
function boot(){
  TTS.init();
  Nav.roots={home:homeScreen(),library:libraryScreen(),settings:settingsScreen()};
  for(const k in Nav.roots)$('#stack').appendChild(Nav.roots[k].el);
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{if(Nav.cur===t.dataset.tab){const sc=$('.scroll',Nav.roots[Nav.cur].el);sc.scrollTo({top:0,behavior:'smooth'})}else{haptic(4);switchTab(t.dataset.tab)}}));
  $('#tabplus').addEventListener('click',()=>openEditor());
  switchTab(Nav.roots[S.prefs.tab]?S.prefs.tab:'home');
  addEventListener('resize',positionLens);
  setTimeout(positionLens,300);
  makeIcon();
  persist();
  Sync.init();
  offlineReady();
}
boot();
</script>
