<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kelime Kartları</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelimeler">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A092D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F6F7FB; --bg2:#ECEEF6; --card:#FFFFFF;
  --card-sh:0 1px 2px rgba(20,24,60,.05),0 4px 18px rgba(20,24,60,.06);
  --text:#0A092D; --text2:#586380; --text3:#939BB4;
  --sep:rgba(10,9,45,.10); --fill:rgba(88,99,128,.10); --fill2:rgba(88,99,128,.2);
  --accent:#4255FF; --accent-text:#3446F0; --accent-soft:rgba(66,85,255,.12); --on-accent:#FFFFFF;
  --good:#12A96B; --good-soft:rgba(18,169,107,.13);
  --warn:#EF7A1F; --warn-soft:rgba(245,130,42,.14);
  --bad:#E5404F; --bad-soft:rgba(229,64,79,.11);
  --star:#FFB400; --sw-on:#34C759;
  --glass-bg:rgba(255,255,255,.6); --glass-brd:rgba(255,255,255,.85);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35);
  --glass-sh:0 8px 26px rgba(20,24,60,.13),0 1px 3px rgba(20,24,60,.08);
  --lens:rgba(10,9,45,.075); --sheet:rgba(246,247,252,.84); --dim:rgba(10,9,45,.24);
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.3,1.45,.5,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A092D; --bg2:#151640; --card:#2E3856; --card-sh:0 1px 2px rgba(0,0,0,.25);
    --text:#F6F7FB; --text2:#A8B1CE; --text3:#6D789C;
    --sep:rgba(255,255,255,.1); --fill:rgba(168,177,206,.14); --fill2:rgba(168,177,206,.26);
    --accent:#5B6BFF; --accent-text:#9DA8FF; --accent-soft:rgba(91,107,255,.22);
    --good:#2BC48A; --good-soft:rgba(43,196,138,.17); --warn:#FF9A4D; --warn-soft:rgba(255,154,77,.17);
    --bad:#FF6470; --bad-soft:rgba(255,100,112,.17); --star:#FFCD1F;
    --glass-bg:rgba(46,56,98,.5); --glass-brd:rgba(255,255,255,.15);
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 1px rgba(255,255,255,.05);
    --glass-sh:0 10px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --lens:rgba(255,255,255,.11); --sheet:rgba(26,30,66,.84); --dim:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
@media (display-mode: standalone){
  /* Ana ekrana eklenince iOS alttaki ana ekran çubuğu alanını kendisi ayırıyor;
     bir kez daha boşluk bırakmayalım. Üstteki durum çubuğu alanı ise bize kalıyor. */
  :root{--safe-b:0px}
}
:root[data-theme="dark"]{
  --bg:#0A092D; --bg2:#151640; --card:#2E3856; --card-sh:0 1px 2px rgba(0,0,0,.25);
  --text:#F6F7FB; --text2:#A8B1CE; --text3:#6D789C;
  --sep:rgba(255,255,255,.1); --fill:rgba(168,177,206,.14); --fill2:rgba(168,177,206,.26);
  --accent:#5B6BFF; --accent-text:#9DA8FF; --accent-soft:rgba(91,107,255,.22);
  --good:#2BC48A; --good-soft:rgba(43,196,138,.17); --warn:#FF9A4D; --warn-soft:rgba(255,154,77,.17);
  --bad:#FF6470; --bad-soft:rgba(255,100,112,.17); --star:#FFCD1F;
  --glass-bg:rgba(46,56,98,.5); --glass-brd:rgba(255,255,255,.15);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 1px rgba(255,255,255,.05);
  --glass-sh:0 10px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --lens:rgba(255,255,255,.11); --sheet:rgba(26,30,66,.84); --dim:rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- temel ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.grow{flex:1;min-width:0}
.muted{color:var(--text2)}

#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#stack{position:absolute;inset:0}

/* ---------- ekranlar ---------- */
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transition:transform .5s var(--ease),filter .5s var(--ease);will-change:transform;overflow:hidden}
.screen.enter-right,.screen.leave-right{transform:translateX(102%)}
.screen.enter-up,.screen.leave-down{transform:translateY(102%)}
.screen.under{transform:translateX(-26%);filter:brightness(.92)}
.screen.root-hidden{display:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--safe-t) + 58px) 16px calc(var(--safe-b) + 112px)}
.screen.pushed .scroll{padding-bottom:calc(var(--safe-b) + 40px)}
.screen.root .scroll{padding-top:calc(var(--safe-t) + 14px)}
.screen.root .nav{min-height:calc(var(--safe-t) + 46px)}

/* üst gezinme — iOS 27 kayan cam düğmeler + kenar bulanıklığı */
.nav{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(var(--safe-t) + 6px) 12px 10px;display:flex;align-items:center;gap:8px;pointer-events:none;min-height:calc(var(--safe-t) + 60px)}
.nav>*{pointer-events:auto}
.nav::before{content:"";position:absolute;inset:0 0 -18px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 92%,transparent) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 55%,transparent 100%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent);mask-image:linear-gradient(to bottom,#000 55%,transparent)}
.nav.scrolled::before,.nav.solid::before{opacity:1}
.nav-title{position:absolute;left:72px;right:72px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none}
.nav.scrolled .nav-title,.nav.solid .nav-title{opacity:1;transform:none}
.nav-title small{display:block;font-size:12px;font-weight:500;color:var(--text2)}
.spacer{flex:1}

/* Liquid Glass */
.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);border:.5px solid var(--glass-brd);box-shadow:var(--glass-hi),var(--glass-sh)}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:transform .35s var(--spring),background .2s;flex:none}
.gbtn:active{transform:scale(1.14)}
.gbtn .ic{width:21px;height:21px}
.gpill{height:44px;border-radius:22px;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;transition:transform .35s var(--spring)}
.gpill:active{transform:scale(1.08)}
.gpill .ic{width:19px;height:19px;stroke-width:2.4}
.gpill.tint,.gbtn.tint{background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);border-color:rgba(255,255,255,.3)}

/* başlıklar */
.ltitle{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:.2px;margin:2px 4px 6px;text-wrap:balance;overflow-wrap:anywhere}
.lsub{color:var(--text2);font-size:15px;margin:0 4px 16px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 4px 10px;font-size:20px;font-weight:700}
.sh .link,.link{font-size:15px;font-weight:600;color:var(--accent-text)}
.foot{font-size:13px;color:var(--text2);margin:8px 16px 0;line-height:1.4}

/* kart yüzeyleri ve gruplu listeler */
.card{background:var(--card);border-radius:26px;box-shadow:var(--card-sh);padding:18px}
.group{background:var(--card);border-radius:26px;box-shadow:var(--card-sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative;width:100%;font-size:16px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.row:active,label.row:active{background:var(--fill)}
.row .val{color:var(--text2);font-size:15px}
.row .rsub{font-size:13px;color:var(--text2);margin-top:2px}
.row.danger{color:var(--bad)}
.row .acc{color:var(--accent-text)}
.row select{appearance:none;-webkit-appearance:none;background:var(--fill);border:0;border-radius:12px;padding:7px 12px;font-size:15px;max-width:58%;color:var(--text)}
.row input[type=range]{width:100%;accent-color:var(--accent)}

/* düğmeler */
.btn{height:54px;border-radius:27px;padding:0 22px;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);width:100%;transition:transform .2s var(--spring),opacity .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sec{background:var(--fill);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent-text)}
.btn.good{background:var(--good);color:#fff}
.btn.warn{background:var(--warn);color:#fff}
.btn.sm{height:44px;border-radius:22px;font-size:16px;width:auto;padding:0 20px}
.btn .ic{width:20px;height:20px;stroke-width:2.3}
.btns{display:grid;gap:10px}
.icbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .15s,transform .2s var(--spring);flex:none}
.icbtn:active{background:var(--fill);transform:scale(1.1)}
.icbtn .ic{width:21px;height:21px}
.icbtn.on{color:var(--star)}
.icbtn.on .ic{fill:currentColor}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--fill);font-size:15px;font-weight:600;color:var(--text)}
.chipbtn .ic{width:18px;height:18px}
.chipbtn:active{background:var(--fill2)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700;letter-spacing:.2px;flex:none}

/* segment kontrol */
.seg{display:flex;background:var(--fill);border-radius:20px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:17px;font-size:14px;font-weight:600;color:var(--text2);text-align:center;padding:0 6px;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(10,9,45,.12)}

/* iOS 27 anahtar */
.sw{appearance:none;-webkit-appearance:none;width:62px;height:28px;border-radius:14px;background:var(--fill2);position:relative;flex:none;margin:0;cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:37px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transition:transform .35s var(--spring)}
.sw:checked{background:var(--sw-on)}
.sw:checked::after{transform:translateX(21px)}

/* alt sekme çubuğu — yüzen cam kapsül */
#tabbar{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 8px);display:flex;gap:10px;z-index:20;transition:transform .45s var(--ease),opacity .3s}
#tabbar.hide{transform:translateY(160%);opacity:0;pointer-events:none}
.tabcap{flex:1;height:62px;border-radius:31px;display:flex;padding:4px;position:relative}
.tablens{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:27px;background:var(--lens);transition:left .5s var(--spring),width .5s var(--spring)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:600;color:var(--text);border-radius:27px;position:relative;z-index:1;transition:color .2s}
.tab .ic{width:25px;height:25px}
.tab.on{color:var(--accent-text)}
.tabplus{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--accent-text);transition:transform .35s var(--spring)}
.tabplus:active{transform:scale(1.12)}
.tabplus .ic{width:27px;height:27px;stroke-width:2.4}

/* alt sayfalar (sheet) */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-dim{position:absolute;inset:0;background:var(--dim);opacity:0;transition:opacity .35s}
.sheet{position:absolute;left:6px;right:6px;bottom:6px;max-height:calc(100% - var(--safe-t) - 18px);border-radius:38px;display:flex;flex-direction:column;transform:translateY(110%);transition:transform .5s var(--ease);background:var(--sheet);-webkit-backdrop-filter:blur(34px) saturate(1.9);backdrop-filter:blur(34px) saturate(1.9);border:.5px solid var(--glass-brd);box-shadow:var(--glass-hi),0 -4px 40px rgba(0,0,0,.18);overflow:hidden}
.sheet.full{top:calc(var(--safe-t) + 12px)}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-dim{opacity:1}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:7px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;min-height:56px;flex:none;touch-action:none}
.sheet-title{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .slot{width:44px;flex:none;display:flex}
.sheet-head .slot.r{justify-content:flex-end}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--safe-b) + 18px);flex:1}
.sheet .gbtn{background:var(--fill);box-shadow:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.opt-label{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:20px 6px 8px}
.opt-label:first-child{margin-top:6px}
.opt-desc{font-size:13px;color:var(--text2);margin:8px 6px 0;line-height:1.4}

/* uyarı kutusu */
.alert-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--dim);opacity:0;transition:opacity .2s;padding:24px}
.alert-wrap.open{opacity:1}
.alert{width:min(310px,100%);border-radius:34px;padding:22px 18px 16px;text-align:center;transform:scale(1.08);transition:transform .35s var(--spring);background:var(--sheet)}
.alert-wrap.open .alert{transform:none}
.alert h3{font-size:17px;font-weight:600;margin-bottom:6px;text-wrap:balance}
.alert p{font-size:14px;color:var(--text2);line-height:1.4;text-wrap:pretty}
.alert-btns{display:flex;gap:8px;margin-top:18px}
.abtn{flex:1;height:48px;border-radius:24px;font-weight:600;font-size:16px;background:var(--fill);text-align:center}
.abtn.pri{background:var(--accent);color:var(--on-accent)}
.abtn.danger{background:var(--bad);color:#fff}

/* açılır menü */
.menu-wrap{position:fixed;inset:0;z-index:60}
.menu{position:fixed;min-width:236px;max-width:calc(100% - 32px);border-radius:26px;padding:6px;transform-origin:top right;animation:pop .32s var(--spring);background:var(--sheet)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:20px;font-size:16px;text-align:left}
.mi span{flex:1}
.mi:active{background:var(--fill)}
.mi.danger{color:var(--bad)}
.msep{height:.5px;background:var(--sep);margin:4px 12px}

/* bildirim */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);z-index:80;transform:translate(-50%,-150%);padding:12px 20px;border-radius:24px;font-weight:600;font-size:15px;transition:transform .45s var(--spring);max-width:calc(100% - 40px);text-align:center;background:var(--sheet)}
.toast.show{transform:translate(-50%,0)}

/* form alanları */
.field{position:relative;margin-top:14px}
.inp{width:100%;border:0;border-bottom:2px solid var(--sep);background:transparent;padding:8px 2px 7px;font-size:17px;outline:none;border-radius:0;resize:none;display:block;line-height:1.35;transition:border-color .2s}
.inp:focus{border-bottom-color:var(--accent)}
textarea.inp{overflow:hidden;min-height:38px}
.inp.big{font-size:22px;font-weight:600}
.field>label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--text3);margin-top:6px}
.inp::placeholder{color:var(--text3);font-weight:400}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:22px;background:var(--fill);padding:0 14px;color:var(--text2)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:17px;min-width:0}
</style>
<style>
/* ---------- ana sayfa ---------- */
.streak{display:flex;align-items:center;gap:14px}
.flame{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.flame .ic{width:26px;height:26px;fill:currentColor;stroke:none}
.streak h3{font-size:17px;font-weight:700}
.streak p{font-size:14px;color:var(--text2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;text-align:center}
.week span{font-size:11.5px;font-weight:600;color:var(--text3)}
.week i{display:block;width:30px;height:30px;border-radius:50%;margin:5px auto 0;background:var(--fill);position:relative}
.week i.on{background:var(--warn)}
.week i.on::after{content:"";position:absolute;left:9px;top:9px;width:12px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg)}
.week i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--warn)}
.cont{margin-top:14px}
.cont .eyebrow{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2)}
.cont h3{font-size:20px;font-weight:700;margin:6px 0 4px;overflow-wrap:anywhere}
.cont .btn{margin-top:14px}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill);gap:2px}
.pbar i{display:block;height:100%;transition:width .5s var(--ease)}
.pbar .m{background:var(--good)}
.pbar .l{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--text2)}
.legend b{color:var(--text);font-weight:700}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--fill2);vertical-align:1px}
.legend .m::before{background:var(--good)}
.legend .l::before{background:var(--warn)}
.setlist{display:grid;gap:10px}
.setcard{display:block;width:100%;background:var(--card);border-radius:24px;box-shadow:var(--card-sh);padding:16px 18px;transition:transform .2s var(--spring)}
.setcard:active{transform:scale(.98)}
.sc-top{display:flex;align-items:flex-start;gap:8px}
.sc-title{flex:1;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.sc-meta{font-size:14px;color:var(--text2);margin:4px 0 12px}
.empty{text-align:center;padding:36px 20px}
.empty .art{width:88px;height:88px;margin:0 auto 14px;border-radius:28px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.empty .art .ic{width:42px;height:42px}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{color:var(--text2);font-size:15px;margin-bottom:18px}

/* ---------- set sayfası ---------- */
.meta-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--text2);font-size:15px;margin:0 4px}
.desc{color:var(--text2);font-size:15px;margin:10px 4px 0;line-height:1.45;-webkit-user-select:text;user-select:text}
.preview{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:18px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.preview::-webkit-scrollbar{display:none}
.pv{flex:0 0 calc(100% - 8px);height:210px;scroll-snap-align:center;perspective:1200px}
.pv-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s var(--ease)}
.pv.flip .pv-in{transform:rotateX(180deg)}
.pv-f{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--card);border-radius:26px;box-shadow:var(--card-sh);display:grid;place-items:center;padding:24px;text-align:center;font-size:24px;overflow-wrap:anywhere;overflow:hidden}
.pv-b{transform:rotateX(180deg)}
.pv-exp{position:absolute;right:10px;bottom:10px}
.pv-count{text-align:center;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.mode{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;box-shadow:var(--card-sh);padding:14px;font-weight:700;font-size:16px;transition:transform .2s var(--spring)}
.mode:active{transform:scale(.97)}
.mode .mic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.mode small{display:block;font-weight:500;font-size:12.5px;color:var(--text2);margin-top:1px}
.terms-bar{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.terms-bar .seg{flex:1}
.tgroup-h{margin:18px 6px 8px;font-size:15px;font-weight:700}
.tgroup-h p{font-weight:400;color:var(--text2);font-size:13.5px;margin-top:2px}
.term{display:flex;gap:6px;background:var(--card);border-radius:20px;box-shadow:var(--card-sh);padding:12px 8px 12px 16px;margin-bottom:8px}
.term .t-t{font-size:17px;font-weight:600;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.term .t-d{font-size:15px;color:var(--text2);margin-top:6px;padding-top:6px;border-top:.5px solid var(--sep);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;white-space:pre-line}
.term .t-acts{display:flex;flex-direction:column;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fill2);margin-right:6px;vertical-align:1px}
.dot.m{background:var(--good)} .dot.l{background:var(--warn)}

/* ---------- düzenleyici ---------- */
.ed-langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ed-langs label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--text3)}
.ed-langs select{display:block;width:100%;margin-top:6px;appearance:none;-webkit-appearance:none;background:var(--card);border:0;border-radius:14px;padding:11px 12px;font-size:16px;box-shadow:var(--card-sh);color:var(--text)}
.ed-tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.ecard{background:var(--card);border-radius:22px;box-shadow:var(--card-sh);padding:6px 16px 14px;margin-top:12px;animation:rise .35s var(--ease)}
.ec-head{display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--sep);padding:2px 0 2px;margin:0 -6px 0 0}
.ec-num{font-weight:700;color:var(--text2);font-size:15px;font-variant-numeric:tabular-nums}
.ecard.err{box-shadow:0 0 0 2px var(--bad)}
.addcard{margin-top:14px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.imp-ta{width:100%;min-height:150px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--card-sh);padding:14px;font-size:16px;outline:none;resize:vertical}
.imp-prev{margin-top:8px}
.imp-prev .row{font-size:15px}
.imp-prev .row b{font-weight:600}
.custom-sep{margin-top:8px;width:100%;border:0;border-radius:14px;background:var(--card);box-shadow:var(--card-sh);padding:10px 12px;font-size:16px;outline:none}

/* ---------- çalışma ekranları ortak ---------- */
.study .nav{background:none}
.sbody{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 62px);bottom:0;display:flex;flex-direction:column}
.nav .ctr{position:absolute;left:70px;right:70px;text-align:center;font-weight:600;font-size:17px;pointer-events:none;font-variant-numeric:tabular-nums}
.nav .ctr small{display:block;font-size:12px;color:var(--text2);font-weight:500}

/* ---------- kartlar ---------- */
.fc-top{display:flex;align-items:center;gap:10px;padding:0 20px 10px}
.cnt{min-width:40px;height:30px;padding:0 10px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;transition:transform .3s var(--spring)}
.cnt.l{background:var(--warn-soft);color:var(--warn)}
.cnt.k{background:var(--good-soft);color:var(--good)}
.cnt.bump{transform:scale(1.25)}
.thin{flex:1;height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.thin i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s var(--ease)}
.fc-stage{flex:1;position:relative;margin:0 16px;perspective:1600px;min-height:0}
.fc-drag{position:absolute;inset:0;touch-action:none;transition:transform .3s var(--ease)}
.fc-drag.appear{animation:cardin .35s var(--ease)}
@keyframes cardin{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.fc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s var(--ease)}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--card);border-radius:32px;box-shadow:var(--card-sh),0 12px 40px rgba(20,24,60,.08);display:flex;align-items:center;justify-content:center;padding:64px 24px 48px;text-align:center;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.fc-back{transform:rotateY(180deg)}
.fc-text{font-size:32px;line-height:1.25;overflow-wrap:anywhere;max-height:100%;overflow-y:auto;white-space:pre-line}
.fc-text.s2{font-size:25px}.fc-text.s3{font-size:20px}.fc-text.s4{font-size:17px}
.fc-acts{position:absolute;top:12px;right:12px;display:flex;gap:2px}
.fc-side{position:absolute;top:22px;left:22px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3)}
.fc-hint{position:absolute;bottom:18px;left:0;right:0;font-size:13px;color:var(--text3)}
.fc-tag{position:absolute;top:22px;padding:5px 14px;border-radius:14px;font-weight:800;font-size:14px;letter-spacing:.5px;opacity:0;pointer-events:none;z-index:3;background:var(--card)}
.fc-tag.l{left:22px;color:var(--warn);border:2px solid var(--warn);transform:rotate(-8deg)}
.fc-tag.k{right:22px;color:var(--good);border:2px solid var(--good);transform:rotate(8deg)}
.fc-ctrl{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 20px calc(var(--safe-b) + 14px)}
.cbtn{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring)}
.cbtn:active{transform:scale(1.12)}
.cbtn .ic{width:26px;height:26px;stroke-width:2.4}
.cbtn.l{color:var(--warn)} .cbtn.k{color:var(--good)}
.cbtn.sm{width:46px;height:46px}
.cbtn.sm .ic{width:21px;height:21px}
.cbtn.on{color:var(--accent-text)}
.srs-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px calc(var(--safe-b) + 14px)}
.srs-btns button{border-radius:20px;padding:10px 4px;text-align:center;font-weight:700;font-size:15px;background:var(--card);box-shadow:var(--card-sh);transition:transform .2s var(--spring)}
.srs-btns button:active{transform:scale(.95)}
.srs-btns small{display:block;font-weight:500;font-size:12px;color:var(--text2);margin-top:2px}
.srs-btns .r{color:var(--bad)} .srs-btns .h{color:var(--warn)} .srs-btns .g{color:var(--good)} .srs-btns .e{color:var(--accent-text)}
.fc-reveal{padding:14px 16px calc(var(--safe-b) + 14px)}

/* sonuç ekranları */
.done{padding:4px 20px calc(var(--safe-b) + 24px);overflow-y:auto;flex:1}
.done h2{font-size:28px;font-weight:700;line-height:1.15;text-wrap:balance;margin-top:8px}
.done .lead{color:var(--text2);font-size:16px;margin-top:8px;text-wrap:pretty}
.ringrow{display:flex;align-items:center;gap:20px;margin:24px 0}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat-list{flex:1;display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;align-items:center;height:40px;padding:0 14px;border-radius:20px;font-weight:700;font-size:15px}
.stat.k{background:var(--good-soft);color:var(--good)}
.stat.l{background:var(--warn-soft);color:var(--warn)}
.stat.n{background:var(--fill);color:var(--text2)}
.stat.b{background:var(--bad-soft);color:var(--bad)}

/* ---------- öğren ---------- */
.lp{display:flex;align-items:center;gap:10px;padding:0 20px 12px}
.lp .num{min-width:30px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--fill);color:var(--text2);padding:0 8px}
.lp .num.g{background:var(--good);color:#fff}
.lp .bar{flex:1;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.lp .bar i{display:block;height:100%;background:var(--good);border-radius:5px;transition:width .5s var(--spring)}
.streakpill{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 14px;border-radius:22px;color:var(--warn);font-weight:800;font-variant-numeric:tabular-nums}
.streakpill .ic{width:18px;height:18px;fill:currentColor;stroke:none}
.streakpill.pop{animation:pop .5s var(--spring)}
.lwrap{flex:1;overflow-y:auto;padding:4px 16px calc(var(--safe-b) + 150px);-webkit-overflow-scrolling:touch}
.lq{background:var(--card);border-radius:30px;box-shadow:var(--card-sh);padding:18px 18px 16px;animation:rise .35s var(--ease)}
.lq-label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.3px;min-height:40px}
.lq-prompt{font-size:26px;line-height:1.28;font-weight:500;margin:6px 2px 22px;overflow-wrap:anywhere;white-space:pre-line;-webkit-user-select:text;user-select:text}
.lq-prompt.s2{font-size:21px}.lq-prompt.s3{font-size:18px}.lq-prompt.s4{font-size:16px}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .num{background:var(--accent);color:#fff}
.center-stage p .ic,.pillsum .ic{width:17px;height:17px;vertical-align:-3px}
.lq-sub{font-size:14px;font-weight:700;color:var(--text2);margin:0 2px 10px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 14px;border-radius:20px;border:2px solid var(--sep);background:var(--card);font-size:17px;text-align:left;transition:border-color .2s,background .2s,opacity .25s,transform .15s}
.opt:active{transform:scale(.98)}
.opt .num{width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;color:var(--text2)}
.opt .num .ic{width:16px;height:16px;stroke-width:3}
.opt .otext{flex:1;overflow-wrap:anywhere;white-space:pre-line}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .num{background:var(--good);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .45s}
.opt.bad .num{background:var(--bad);color:#fff}
.opt.dim{opacity:.42}
.opts.locked .opt{pointer-events:none}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf-grid .opt{justify-content:center;font-weight:700}
.tf-cand{border-top:.5px solid var(--sep);padding-top:14px;margin:-8px 2px 20px}
.tf-cand .k{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--text3);text-transform:uppercase}
.tf-cand div{font-size:21px;margin-top:4px;overflow-wrap:anywhere;white-space:pre-line}
.dk{display:block;margin:16px auto 0;color:var(--accent-text);font-weight:600;font-size:15px;padding:8px 12px}
.winput{width:100%;min-height:56px;border-radius:18px;border:2px solid var(--sep);background:var(--bg);padding:14px 16px;font-size:18px;outline:none;transition:border-color .2s}
.winput:focus{border-color:var(--accent)}
.winput.ok{border-color:var(--good);background:var(--good-soft)}
.w-acts{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.w-acts .dk{margin:0}
.cmp{border-radius:18px;padding:12px 14px;border:2px solid var(--sep);margin-top:10px}
.cmp .k{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.cmp .v{font-size:18px;margin-top:4px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;justify-content:space-between;white-space:pre-line}
.cmp.bad{border-color:var(--bad);background:var(--bad-soft)} .cmp.bad .k{color:var(--bad)} .cmp.bad .v{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.cmp.skip .v{text-decoration:none;color:var(--text2)}
.cmp.ok{border-color:var(--good);background:var(--good-soft)} .cmp.ok .k{color:var(--good)}
.lfc{min-height:150px;border-radius:22px;border:2px dashed var(--sep);display:grid;place-items:center;text-align:center;padding:18px;color:var(--text3);font-size:15px}
.lfc.open{border-style:solid;border-color:var(--accent);color:var(--text);font-size:22px;background:var(--accent-soft)}
.self{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fb{position:absolute;left:10px;right:10px;bottom:calc(var(--safe-b) + 10px);border-radius:32px;padding:16px 16px 14px;transform:translateY(140%);transition:transform .45s var(--spring);z-index:8;background:var(--sheet)}
.fb.show{transform:none}
.fb-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin:0 4px 12px}
.fb-t .ic{width:22px;height:22px;stroke-width:2.6}
.fb-t.g{color:var(--good)} .fb-t.b{color:var(--bad)} .fb-t.w{color:var(--warn)}
.fb-note{font-size:14px;color:var(--text2);margin:-6px 4px 12px}
.fb .btns{grid-template-columns:1fr}
.fb .btns.two{grid-template-columns:auto 1fr}
.cp-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px}
.cp-item .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.cp-item .st .ic{width:15px;height:15px;stroke-width:3}
.cp-item .st.g{background:var(--good);color:#fff} .cp-item .st.w{background:var(--warn);color:#fff}
.cp-item .tt{font-weight:600;overflow-wrap:anywhere}
.cp-item .dd{font-size:14px;color:var(--text2);overflow-wrap:anywhere}
.sticky-cta{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(var(--safe-b) + 14px);background:linear-gradient(to top,var(--bg) 60%,transparent)}
.steps{list-style:none;padding:0;margin:20px 0;display:grid;gap:12px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--card-sh);counter-increment:s;font-size:15px;line-height:1.4;color:var(--text2)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.steps b{color:var(--text)}
.bigbadge{width:84px;height:84px;border-radius:28px;background:var(--good);color:#fff;display:grid;place-items:center;margin:12px 0 4px;animation:pop .6s var(--spring)}
.bigbadge .ic{width:44px;height:44px;stroke-width:2.6}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:9}

/* ---------- test ---------- */
.t-sec{margin-top:22px}
.t-sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 6px 10px;font-size:18px;font-weight:700}
.t-sec-h span{font-size:14px;font-weight:600;color:var(--text2)}
.tq{background:var(--card);border-radius:26px;box-shadow:var(--card-sh);padding:16px;margin-bottom:12px;scroll-margin:110px;transition:box-shadow .25s}
.tq.cur{box-shadow:var(--card-sh),0 0 0 2px var(--accent-soft)}
.tq-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--text2);min-height:34px}
.tq-h .res{font-size:13px;font-weight:800;padding:3px 10px;border-radius:11px}
.tq-h .res.g{background:var(--good-soft);color:var(--good)} .tq-h .res.b{background:var(--bad-soft);color:var(--bad)}
.tq .lq-prompt{font-size:21px;margin:4px 2px 16px}
.tq .opt{min-height:52px;font-size:16px}
.mt-row{padding:12px 0;border-top:.5px solid var(--sep)}
.mt-row:first-of-type{border-top:0}
.mt-p{font-size:16px;margin-bottom:8px;overflow-wrap:anywhere;white-space:pre-line}
.mt-slot{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;border-radius:14px;border:2px dashed var(--fill2);padding:8px 12px;color:var(--text3);font-size:15px;text-align:left;transition:border-color .2s,background .2s}
.mt-slot.act{border-color:var(--accent);background:var(--accent-soft)}
.mt-slot.filled{border-style:solid;border-color:var(--sep);color:var(--text)}
.mt-slot.ok{border-color:var(--good);background:var(--good-soft)} .mt-slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.mt-slot b,.mt-chip b{width:24px;height:24px;border-radius:8px;background:var(--fill);display:grid;place-items:center;font-size:13px;flex:none;color:var(--text2)}
.mt-fix{font-size:13.5px;color:var(--good);margin-top:6px;font-weight:600}
.mt-choices{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
.mt-chip{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:14px;background:var(--bg);font-size:15px;text-align:left;border:2px solid transparent;transition:opacity .2s,border-color .2s}
.mt-chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt-chip.used{opacity:.4}
.t-submit{text-align:center;padding:26px 20px}
.t-submit h3{font-size:19px;margin-bottom:16px;text-wrap:balance}
.t-res .next{display:grid;gap:10px;margin-top:18px}
.t-res h2{font-size:24px}
.pillsum{font-size:14px;color:var(--text2);margin-top:4px}
.setup .row{padding:12px 16px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:20px;font-weight:600}
.stepper input{width:48px;text-align:center;border:0;background:transparent;font-size:17px;font-weight:700;outline:none;font-variant-numeric:tabular-nums}

/* ---------- eşleştir ---------- */
.m-top{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px 12px}
.m-time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.m-pen{position:absolute;left:50%;top:calc(var(--safe-t) + 100px);transform:translateX(-50%);color:var(--bad);font-weight:800;font-size:20px;animation:floatup .8s ease forwards;pointer-events:none;z-index:9}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px calc(var(--safe-b) + 16px);grid-auto-rows:1fr;min-height:0}
.mtile{border-radius:20px;background:var(--card);box-shadow:var(--card-sh);padding:8px;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.25;border:2px solid transparent;overflow:hidden;overflow-wrap:anywhere;transition:opacity .35s,transform .35s var(--spring),border-color .15s,background .15s}
.mtile.s{font-size:13px}.mtile.xs{font-size:11.5px}
.mtile.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.03)}
.mtile.ok{border-color:var(--good);background:var(--good-soft)}
.mtile.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}

<script>
'use strict';
/* =========================================================
   Yardımcılar
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
const DAY=864e5;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
function h(str){const t=document.createElement('template');t.innerHTML=str.trim();return t.content.firstElementChild}
function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* iPhone uygulaması içinde çalışırken (WKWebView) ses, titreşim ve paylaşım yerel koda gider */
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native);
function nativePost(o){try{window.webkit.messageHandlers.native.postMessage(o);return true}catch(e){return false}}
function haptic(ms=8){if(NATIVE){nativePost({type:'haptic',ms});return}try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function sizeCls(t,pre='s'){const n=String(t||'').length;return n>160?pre+'4':n>80?pre+'3':n>28?pre+'2':''}
const LANGS=[['en-US','İngilizce (ABD)'],['en-GB','İngilizce (BK)'],['tr-TR','Türkçe'],['de-DE','Almanca'],['fr-FR','Fransızca'],['es-ES','İspanyolca'],['it-IT','İtalyanca'],['ru-RU','Rusça'],['ar-SA','Arapça']];
const langName=c=>(LANGS.find(l=>l[0]===c)||[c,c])[1].replace(/ \(.*\)/,'');

/* =========================================================
   Veri — önce cihaz (localStorage), varsa hesaba eşitleme
   ========================================================= */
const LS='kelimeKartlari.v1';
const DEF_PREFS={rate:0.9,voiceEn:'',tab:'home',lastSet:null,libSort:'recent'};
function blankSet(title=''){return{id:uid(),title,desc:'',termLang:'en-US',defLang:'tr-TR',cards:[],created:now(),updated:now(),studied:0,prog:{},fcs:null,fcp:null,srs:{},srsNew:{},lopt:null,topt:null,best:null,round:0,example:false}}
function seedStore(){
  const s=blankSet('Örnek set · Günlük İngilizce');
  s.example=true;
  s.desc='Uygulamayı denemen için hazır örnek. Kendi kelimelerini eklemek için sağ alttaki + düğmesine dokun; bu seti istediğin zaman silebilirsin.';
  s.cards=[['achieve','başarmak, elde etmek'],['borrow','ödünç almak'],['careful','dikkatli'],['decide','karar vermek'],['enough','yeterli'],['forget','unutmak'],['improve','geliştirmek'],['journey','yolculuk'],['knowledge','bilgi'],['neighbor','komşu'],['opportunity','fırsat'],['remember','hatırlamak'],['suddenly','aniden'],['weather','hava durumu']].map(([t,d])=>({id:uid(),t,d,star:false}));
  return{v:1,sets:{[s.id]:s},order:[s.id],deleted:{},prefs:{...DEF_PREFS},days:{},mu:0};
}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.sets&&o.order)return o}}catch(e){}return null}
let S=loadLocal()||seedStore();
S.prefs={...DEF_PREFS,...(S.prefs||{})};S.days=S.days||{};S.deleted=S.deleted||{};S.mu=S.mu||0;
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function touchSet(set){set.updated=now();persist();Sync.dirty(set.id)}
function touchMeta(){S.mu=now();persist();Sync.dirty('meta')}
const setsOrdered=()=>S.order.map(id=>S.sets[id]).filter(Boolean);
function markStudied(set){set.studied=now();const k=dayKey();const first=!S.days[k];S.days[k]=(S.days[k]||0)+1;S.prefs.lastSet=set.id;if(first)touchMeta();else{persist();Sync.dirty('meta',8000)}}
const stageOf=(set,c)=>(set.prog[c.id]&&set.prog[c.id].s)||0;
function counts(set,cards=set.cards){let ns=0,lr=0,ms=0;for(const c of cards){const s=stageOf(set,c);if(s===0)ns++;else if(s===3)ms++;else lr++}return{ns,lr,ms,n:cards.length}}
function streakDays(){let n=0;const d=new Date();if(!S.days[dayKey(d)])d.setDate(d.getDate()-1);while(S.days[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function addSet(set){S.sets[set.id]=set;S.order=[set.id,...S.order.filter(x=>x!==set.id)];delete S.deleted[set.id];touchSet(set);touchMeta()}
function removeSet(id){delete S.sets[id];S.order=S.order.filter(x=>x!==id);S.deleted[id]=now();if(S.prefs.lastSet===id)S.prefs.lastSet=null;persist();touchMeta();Sync.dirty(id)}
function pbarHTML(c){const t=c.n||1;return`<div class="pbar"><i class="m" style="width:${c.ms/t*100}%"></i><i class="l" style="width:${c.lr/t*100}%"></i></div>`}

/* claude.ai içinde açıldığında hesabına özel bulut kaydı (telefon ↔ bilgisayar) */
const Sync={db:null,col:null,on:false,q:new Set(),busy:false,timer:0,
  async init(){
    try{
      if(!window.claude||typeof window.claude.use!=='function')return;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const id=await user.id();if(!id)return;
      this.db=db;this.col=db.collection('data/users/'+id);
      await this.pull(true);
      this.on=true;this.kick();
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.pull(false)});
      refreshVisible();
    }catch(e){console.warn('sync init',e)}
  },
  async pull(first){
    if(!this.col)return;
    try{
      const snap=await this.col.get();const remote={};let meta=null;
      for(const d of snap.docs){const b=d.data();if(!b)continue;if(d.id==='meta')meta=b;else if(d.id.startsWith('set_')&&b.set&&b.set.id)remote[b.set.id]=b.set}
      let changed=false;const push=[];
      const rdel=(meta&&meta.deleted)||{};
      for(const k in rdel)S.deleted[k]=Math.max(S.deleted[k]||0,rdel[k]);
      const ids=new Set([...Object.keys(S.sets),...Object.keys(remote)]);
      for(const id of ids){
        const L=S.sets[id],R=remote[id],dt=S.deleted[id]||0;
        if(dt&&Math.max(L?L.updated:0,R?R.updated:0)<=dt){if(L){delete S.sets[id];changed=true}if(R)push.push(id);continue}
        if(id===ACTIVE_SET&&L){push.push(id);continue}
        if(R&&(!L||R.updated>L.updated)){S.sets[id]=R;changed=true}
        else if(L&&(!R||L.updated>R.updated))push.push(id);
      }
      if(meta){for(const k in meta.days||{})S.days[k]=Math.max(S.days[k]||0,meta.days[k])}
      if(meta&&meta.mu>S.mu){S.prefs={...S.prefs,...(meta.prefs||{}),tab:S.prefs.tab};S.order=(meta.order||[]).slice();S.mu=meta.mu;changed=true}
      else if(!meta||S.mu>meta.mu||JSON.stringify(meta.days||{})!==JSON.stringify(S.days)||JSON.stringify(meta.order||[])!==JSON.stringify(S.order))push.push('meta');
      const inOrder=new Set(S.order);S.order=S.order.filter(id=>S.sets[id]);
      for(const id of Object.keys(S.sets))if(!inOrder.has(id))S.order.unshift(id);
      persist();push.forEach(id=>this.q.add(id));
      if(this.on)this.kick();
      if(changed&&!first)refreshVisible();
    }catch(e){console.warn('sync pull',e)}
  },
  dirty(id,delay=1500){this.q.add(id);if(!this.on)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),delay)},
  kick(){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),300)},
  async flush(){
    if(!this.on||this.busy)return;this.busy=true;
    try{
      while(this.q.size){
        const id=this.q.values().next().value;this.q.delete(id);
        try{
          if(id==='meta')await this.col.doc('meta').set({mu:S.mu,prefs:S.prefs,order:S.order,deleted:S.deleted,days:S.days});
          else if(S.sets[id])await this.col.doc('set_'+id).set({set:S.sets[id]});
          else await this.col.doc('set_'+id).delete();
        }catch(e){
          if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){this.q.add(id);await sleep(2000+Math.random()*1500)}
          else if(e&&e.code==='revoked'){this.on=false;break}
          else console.warn('sync write',id,e);
        }
      }
    }finally{this.busy=false}
  }
};

/* =========================================================
   Sesli okuma (iOS Safari Web Speech)
   ========================================================= */
const TTS={voices:[],
  init(){
    if(NATIVE){window.__setVoices=l=>{this.voices=(l||[]).map(v=>({name:v.name,lang:v.lang,voiceURI:v.id,localService:true}));const st=Nav.roots.settings;if(st&&Nav.cur==='settings')st.refresh()};nativePost({type:'voices'});return}
    if(!('speechSynthesis' in window))return;const load=()=>{this.voices=speechSynthesis.getVoices()||[]};load();try{speechSynthesis.addEventListener('voiceschanged',load)}catch(e){speechSynthesis.onvoiceschanged=load}},
  list(base){return this.voices.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(base))},
  pick(lang){
    const base=lang.slice(0,2).toLowerCase();const vs=this.list(base);if(!vs.length)return null;
    if(base==='en'&&S.prefs.voiceEn){const f=vs.find(v=>v.voiceURI===S.prefs.voiceEn);if(f)return f}
    const ex=vs.filter(v=>v.lang.replace('_','-').toLowerCase()===lang.toLowerCase());const pool=ex.length?ex:vs;
    return pool.find(v=>/premium|enhanced|geliştirilmiş/i.test(v.name))||pool.find(v=>/Samantha|Ava|Allison|Susan|Karen|Daniel|Yelda|Siri/i.test(v.name))||pool.find(v=>v.localService)||pool[0];
  },
  speak(text,lang='en-US'){
    if(!text)return;
    if(NATIVE){nativePost({type:'speak',text:String(text).replace(/\s*[\/;]\s*/g,', '),lang,rate:S.prefs.rate||0.9,voice:lang.startsWith('en')?S.prefs.voiceEn:''});return}
    if(!('speechSynthesis' in window))return;
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/\s*[\/;]\s*/g,', '));u.lang=lang;const v=this.pick(lang);if(v)u.voice=v;u.rate=S.prefs.rate||0.9;speechSynthesis.speak(u)}catch(e){}
  },
  stop(){if(NATIVE){nativePost({type:'stop'});return}try{speechSynthesis.cancel()}catch(e){}}
};

/* =========================================================
   Cevap değerlendirme — büyük/küçük harf, noktalama, “to/a/the”,
   virgülle ayrılmış alternatifler, küçük yazım hataları
   ========================================================= */
function fold(s,loose){
  s=String(s||'').replace(/İ/g,'i').replace(/I/g,'i').toLowerCase().replace(/ı/g,'i');
  s=s.replace(/[’‘`´]/g,"'");
  if(loose)s=s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/'/g,'');
  return s.replace(/[.,!?;:"“”()\[\]{}…\-–—_\/\\]+/g,' ').replace(/\s+/g,' ').trim();
}
function variants(ans){
  const out=new Set();const add=x=>{x=String(x).trim();if(x)out.add(x)};
  add(ans);add(ans.replace(/\([^)]*\)/g,' '));add(ans.replace(/[()]/g,''));
  for(const p of String(ans).split(/[,;\/\n]| or | veya /)){add(p);add(p.replace(/\([^)]*\)/g,' '))}
  return[...out];
}
const stripPre=s=>s.replace(/^(to|a|an|the) /,'');
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function grade(input,answer,mode='lenient'){
  const a=fold(input,false);if(!a)return'no';
  const vs=variants(answer);
  for(const v of vs){const b=fold(v,false);if(a===b||stripPre(a)===stripPre(b))return'ok'}
  if(mode==='strict')return'no';
  const al=stripPre(fold(input,true));
  for(const v of vs){const bl=stripPre(fold(v,true));if(!bl)continue;if(al===bl)return'close';const L=bl.length,tol=L>=8?2:L>=4?1:0;if(tol&&lev(al,bl)<=tol)return'close'}
  return'no';
}
/* çeldiriciler: aynı setteki diğer kartların aynı yüzü */
function distractors(set,card,side,n){
  const key=side==='t'?'t':'d';const ans=fold(card[key],true);const seen=new Set([ans]);const out=[];
  for(const c of shuffle(set.cards)){if(c.id===card.id)continue;const f=fold(c[key],true);if(!f||seen.has(f))continue;seen.add(f);out.push(c[key]);if(out.length>=n)break}
  return out;
}

const Nav={stack:[],roots:{},cur:'home'};

function makeScreen({title='',sub='',left='',right='',body='',cls=''}){

const backBtn=`<button class="gbtn glass" data-back aria-label="Geri">${ic('back')}</button>`;
const closeBtn=`<button class="gbtn glass" data-back aria-label="Kapat">${ic('x')}</button>`;
function push(scr,mode='push'){
  const prev=topScreen();scr.mode=mode;Nav.stack.push(scr);
  scr.el.classList.add('pushed',mode==='cover'?'enter-up':'enter-right');
  $('#stack').appendChild(scr.el);
  $$('[data-back]',scr.el).forEach(b=>b.addEventListener('click',()=>scr.close?scr.close():pop()));
  void scr.el.offsetWidth;
  scr.el.classList.remove('enter-up','enter-right');if(prev&&mode==='push')prev.el.classList.add('under');
  if(mode==='push')edgeBack(scr);
  updateTabbar();
}
function pop(){
  const scr=Nav.stack.pop();if(!scr)return;
  try{scr.onClose&&scr.onClose()}catch(e){}
  TTS.stop();

  setTimeout(()=>scr.el.remove(),520);

  updateTabbar();
}
function popTo(n){while(Nav.stack.length>n)pop()}
function edgeBack(scr){
  const el=scr.el;let sx=null,dx=0;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];if(t.clientX<24&&Nav.stack[Nav.stack.length-1]===scr){sx=t.clientX;dx=0;el.style.transition='none'}},{passive:true});
  el.addEventListener('touchmove',e=>{if(sx===null)return;dx=Math.max(0,e.touches[0].clientX-sx);el.style.transform=`translateX(${dx}px)`},{passive:true});
  const end=()=>{if(sx===null)return;sx=null;el.style.transition='';el.style.transform='';if(dx>innerWidth*.3)(scr.close?scr.close():pop())};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
}

function sheet({title='',body='',right='',full=false,onClose}={}){

  $('#app').appendChild(w);
  void w.offsetWidth;w.classList.add('open');
  let closed=false;
  const close=()=>{if(closed)return;closed=true;w.classList.remove('open');sh.style.transform='';setTimeout(()=>w.remove(),480);onClose&&onClose()};
  $('.sheet-dim',w).addEventListener('click',close);

  let sy=null,dy=0;const head=$('.sheet-head',w),grab=$('.grab',w);

  const tm=e=>{if(sy===null)return;dy=Math.max(0,e.touches[0].clientY-sy);sh.style.transform=`translateY(${dy}px)`};
  const te=()=>{if(sy===null)return;sy=null;sh.style.transition='';if(dy>110)close();else sh.style.transform=''};
  [head,grab].forEach(x=>{x.addEventListener('touchstart',ts,{passive:true});x.addEventListener('touchmove',tm,{passive:true});x.addEventListener('touchend',te)});
  return{el:w,body:bodyEl,close};
}
function ask({title,msg='',ok='Tamam',cancel='Vazgeç',danger=false}){

const segHTML=(id,opts,val)=>`<div class="seg" id="${id}" role="radiogroup">${opts.map(([v,l])=>`<button type="button" role="radio" aria-checked="${String(v)===String(val)}" data-v="${v}" class="${String(v)===String(val)?'on':''}">${esc(l)}</button>`).join('')}</div>`;

function ringSVG(pct,color='var(--good)',track='var(--fill)'){const r=52,c=2*Math.PI*r;return`<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="${track}" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-clamp(pct,0,1))}" style="transition:stroke-dashoffset .8s var(--ease)"/></svg>`}
async function saveFile(name,text){
